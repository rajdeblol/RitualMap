<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RITUALNET</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{margin:0;background:#000;overflow:hidden;height:100vh;font-family:'Rajdhani',sans-serif;color:#0f0;}
    #map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
    .leaflet-control-zoom, .leaflet-control-attribution{display:none!important;}

    .title-bar{position:absolute;top:0;left:0;right:0;height:110px;background:linear-gradient(to bottom,rgba(0,30,0,0.98),transparent);display:flex;align-items:center;justify-content:center;gap:25px;z-index:100;user-select:none;}
    #ritualLogo{width:82px;height:82px;cursor:pointer;filter:drop-shadow(0 0 40px #00ff41);animation:glow 5s infinite alternate;transition:0.3s;position:relative;}
    #ritualLogo img{width:100%;height:100%;position:absolute;top:0;left:0;z-index:2;}
    #ritualLogo::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68%;height:68%;background:url('ritualnet-logo.png') center/contain no-repeat;opacity:0.18;z-index:-1;pointer-events:none;animation:ritualPulse 6s infinite ease-in-out;}
    #ritualLogo:hover{transform:scale(1.25);}

    .title-text{font-family:'Orbitron',sans-serif;font-size:56px;font-weight:900;background:linear-gradient(90deg,#00ff41,#00ff99);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px #00ff4188;letter-spacing:12px;cursor:pointer;position:relative;}
    .title-text::before{content:'RITUALNET';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:56px;letter-spacing:12px;opacity:0.18;background:linear-gradient(90deg,#00ff41,#00ff99);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ritualPulse 6s infinite ease-in-out;z-index:-1;}

    .subtitle{position:absolute;top:100px;left:50%;transform:translateX(-50%);font-size:16px;letter-spacing:2px;color:#00ff88;text-shadow:0 0 20px #00ff41;font-family:'Orbitron',sans-serif;white-space:nowrap;z-index:100;}

    @keyframes glow{0%{filter:drop-shadow(0 0 30px #00ff41);}100%{filter:drop-shadow(0 0 70px #00ff41);}}
    @keyframes ritualPulse{0%,100%{opacity:0.15;transform:translate(-50%,-50%) scale(1);}50%{opacity:0.25;transform:translate(-50%,-50%) scale(1.08);}}

    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;z-index:200;}
    .card{width:430px;background:#000;padding:50px 40px;border:3px solid #00ff41;border-radius:30px;text-align:center;position:relative;box-shadow:0 0 100px rgba(0,255,65,0.7);}
    .close-btn{position:absolute;top:20px;right:25px;width:40px;height:40px;background:transparent;border:2px solid #00ff41;border-radius:50%;color:#00ff41;font-size:28px;cursor:pointer;}
    .close-btn:hover{background:#00ff4111;transform:rotate(90deg);}
    .card h2{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:42px;text-shadow:0 0 30px #00ff41;margin-bottom:40px;letter-spacing:8px;}
    
    .avatar-circle{width:140px;height:140px;border-radius:50%;margin:30px auto;border:6px solid #00ff41;overflow:hidden;background:#000;box-shadow:0 0 60px #00ff4188;position:relative;}
    .avatar-circle img{width:100%;height:100%;object-fit:cover;position:relative;z-index:2;}
