<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>RITUALNET</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');

    /* Base / mobile-safe */
    html, body {
      margin: 0; padding: 0;
      background: #000 !important; color: #0f0;
      height: 100%; min-height: 100%;
      font-family: 'Rajdhani', sans-serif;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    *{box-sizing:border-box;}

    /* MAP full-bleed (JS sets exact pixels for mobile) */
    #map {
      position: fixed; inset: 0; width:100%; height:100%; z-index:1; background:#000;
    }
    .leaflet-control-zoom, .leaflet-control-attribution { display:none!important; }

    /* Title */
    .title-bar{
      position:absolute; top:0; left:0; right:0; height:110px;
      background:linear-gradient(to bottom,rgba(0,30,0,0.98),transparent);
      display:flex;align-items:center;justify-content:center;gap:25px;z-index:100;user-select:none;
      padding-top: env(safe-area-inset-top); pointer-events:auto;
    }
    #ritualLogo{ width:72px;height:72px; cursor:pointer; filter:drop-shadow(0 0 40px #00ff41); animation:glow 5s infinite alternate; transition:0.25s; position:relative; }
    #ritualLogo img{ width:100%; height:100%; display:block; }
    .title-text{ font-family:'Orbitron',sans-serif; font-size:48px; font-weight:900; background:linear-gradient(90deg,#00ff41,#00ff99); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 60px #00ff4188; letter-spacing:10px; cursor:pointer; }
    .subtitle{ position:absolute; top:92px; left:50%; transform:translateX(-50%); font-size:14px; color:#00ff88; text-shadow:0 0 20px #00ff41; font-family:'Orbitron',sans-serif; z-index:100; pointer-events:none; }

    @keyframes glow{0%{filter:drop-shadow(0 0 30px #00ff41);}100%{filter:drop-shadow(0 0 70px #00ff41);}}

    /* PANEL */
    .panel{
      position:absolute; left:20px; bottom:20px;
      width:380px; max-width:calc(100vw - 40px);
      background:#000; border:3px solid #00ff41; border-radius:20px;
      padding:14px; box-shadow:0 0 80px rgba(0,255,65,0.6);
      z-index:10; display:flex; flex-direction:column; gap:8px; pointer-events:auto;
      transition: transform .28s ease, opacity .28s ease;
    }
    .panel.collapsed { transform: translateY(0); } /* placeholder for toggles */

    .panel-header {
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .panel h3{
      margin:0; font-family:'Orbitron',sans-serif; color:#00ff41; font-size:22px; letter-spacing:1px;
      background:#001100; padding:8px 12px; border-radius:12px; box-shadow: inset 0 0 20px rgba(0,255,65,0.08);
    }

    /* collapse toggle */
    .panel-toggle {
      background:transparent; border:2px solid #00ff41; color:#00ff41; padding:6px 10px; border-radius:12px;
      cursor:pointer; font-family:'Orbitron',sans-serif; font-weight:700;
    }
    .panel-toggle:active { transform:scale(.98); }

    /* RECENT list — default for desktop */
    #recent {
      max-height: calc(72px * 3 + 6px); /* 3 visible rows */
      overflow-y: auto;
      scroll-behavior: smooth;
      padding-right:6px;
    }

    .entry{
      display:flex;align-items:center;margin:6px 0;padding:10px;
      background:rgba(0,255,65,0.03);border:2px solid #00ff41;border-radius:14px;position:relative;
      height:72px; flex-shrink:0;
    }
    .entry img{ width:48px; height:48px; border-radius:50%; border:3px solid #00ff41; margin-right:12px; box-shadow:0 0 30px #00ff4188; }
    .entry .name{ color:#00ff88; font-weight:700; font-family:'Orbitron',sans-serif; font-size:15px; }
    .entry .pledge{ color:#00ff88; font-size:13px; margin-top:6px; opacity:0.95; }

    /* make it lighter on desktop but compact on mobile */
    @media (max-width:420px) {
      .panel{
        left:12px; bottom:12px;
        width:86%; /* wider but not full width */
        max-width:420px;
        padding:10px;
        border-radius:14px;
      }
      .title-text { font-size:32px; letter-spacing:6px; }
      .subtitle { top:82px; font-size:12px; }

      /* reduce header font, show only 38vh for panel's content */
      #recent {
        max-height: 38vh; /* less vertical space so map remains visible */
        overflow-y: auto;
      }

      .entry { height:64px; padding:8px; }
      .entry img { width:42px; height:42px; margin-right:10px; }
      .entry .name { font-size:14px; }
      .entry .pledge { font-size:12px; }

      /* show toggle on mobile */
      .panel-toggle { display:inline-block; font-size:12px; padding:6px 8px; }
    }

    /* popups and markers styling retained */
    .ritual-marker img{border-radius:50%;border:4px solid #00ff41;box-shadow:0 0 30px #00ff41;}
    .leaflet-popup-content-wrapper { background: #000 !important; color: #0f0 !important; border: 3px solid #00ff41 !important; border-radius: 16px !important; padding: 0 !important; box-shadow: 0 0 40px rgba(0,255,65,0.6) !important; }
    .leaflet-popup-content { margin: 0 !important; padding: 14px !important; text-align: center !important; font-family: 'Orbitron', sans-serif !important; }
    .leaflet-popup-content img { width: 72px !important; height: 72px !important; border-radius: 50% !important; border: 4px solid #00ff41 !important; margin-bottom: 10px !important; box-shadow: 0 0 20px #00ff41 !important; }

  </style>
</head>
<body>
  <div id="map"></div>

  <div class="title-bar">
    <div id="ritualLogo"><img src="ritualnet-logo.png" alt="logo"></div>
    <div class="title-text" id="titleLink">RITUALNET</div>
  </div>

  <div class="subtitle">Let’s Make The World Ritualize</div>

  <!-- PANEL with toggle -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <h3>Recent Summonings</h3>
      <button class="panel-toggle" id="panelToggle" aria-expanded="true">Hide</button>
    </div>
    <div id="recent" style="scroll-snap-type: y mandatory;"></div>
  </div>

  <!-- Modal kept as before (not changed) -->
  <div class="modal" id="ritualModal" style="display:none;">
    <div class="card">
      <div class="close-btn" id="closeBtn">X</div>
      <h2>PERFORM THE RITUAL</h2>
      <div class="avatar-circle"><img src="ritualnet-logo.png" id="avatarPreview" alt="avatar"></div>
      <label class="upload-btn">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field input-field" id="pledge" placeholder="Speak your pledge..."></textarea>
      <button class="join-btn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <div class="success" id="success" style="display:none;">
    <div class="ritual-circle"></div>
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <script>
    // ---------- SUPABASE init (unchanged) ----------
    const SUPABASE_URL = 'https://xgttfiqewnwpqguhbpgv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndHRmaXFld253cHFndWhicGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxOTY1ODgsImV4cCI6MjA3ODc3MjU4OH0.zVK46pTGH0_Ruu20s35ep8NnsQd2ROenG_EuWezXiWg';
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.__supabase = supabase;

    // ---------- Mobile height fix ----------
    function setFullHeight() {
      const vh = window.innerHeight;
      document.documentElement.style.height = vh + 'px';
      document.body.style.height = vh + 'px';
      const mapEl = document.getElementById('map');
      if (mapEl) mapEl.style.height = vh + 'px';
    }
    function debounce(fn, wait=120){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), wait); }; }
    setFullHeight();
    window.addEventListener('resize', debounce(setFullHeight, 120));
    window.addEventListener('orientationchange', debounce(setFullHeight, 120));
    window.addEventListener('scroll', debounce(setFullHeight, 300));

    // ---------- Map ----------
    const map = L.map('map', { zoomControl:false, attributionControl:false, minZoom:2, maxZoom:19 }).setView([10,0],2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const markers = L.layerGroup().addTo(map);
    const recent = document.getElementById('recent');
    let clickedPos = null;
    const addedIds = new Set();

    function getSize() {
      const z = map.getZoom();
      if (z <= 3) return 30;
      if (z <= 5) return 40;
      if (z <= 7) return 50;
      return 65;
    }
    function createIcon(src) {
      const s = getSize();
      return L.divIcon({
        className: 'ritual-marker',
        html: `<img src="${src}" style="width:${s}px;height:${s}px;">`,
        iconSize: [s,s],
        iconAnchor: [s/2, s/2]
      });
    }
    map.on('zoomend', ()=> {
      markers.eachLayer(m => {
        try {
          const data = m.options?.data || m.data;
          if (data?.avatar) m.setIcon(createIcon(data.avatar));
        } catch(e){ console.error(e); }
      });
    });

    function addSummoningToUI(s) {
      if (!s) return;
      if (s.id && addedIds.has(s.id)) return;
      if (s.id) addedIds.add(s.id);

      const avatarUrl = s.avatar || 'ritualnet-logo.png';
      const icon = createIcon(avatarUrl);
      const m = L.marker([s.lat, s.lng], { icon, data: s }).addTo(markers);
      m.data = s;

      m.bindPopup(`<div style="text-align:center;"><img src="${avatarUrl}"><b>@${s.name}</b><i>"${s.pledge}"</i></div>`);

      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `<img src="${avatarUrl}"><div style="flex:1;"><div class="name">@${s.name}</div><div class="pledge">"${s.pledge}"</div></div>`;
      recent.prepend(entry);
    }

    async function loadAll() {
      try {
        const { data, error } = await window.__supabase.from('summonings').select('*').order('timestamp', { ascending: false }).limit(200);
        if (error) {
          console.warn('Supabase load error', error);
          // fallback to cached full rows if available
          const cached = localStorage.getItem('ritualnet_summonings_full');
          if (cached) {
            try {
              const rows = JSON.parse(cached);
              markers.clearLayers(); recent.innerHTML = ''; addedIds.clear();
              rows.forEach(r => addSummoningToUI(r));
            } catch(e){ console.error('cache parse failed', e); }
          }
          return;
        }
        try { localStorage.setItem('ritualnet_summonings_full', JSON.stringify(data)); } catch(e){}
        markers.clearLayers(); recent.innerHTML = ''; addedIds.clear();
        data.forEach(s => addSummoningToUI(s));
      } catch (err) { console.error('loadAll unexpected', err); }
    }
    loadAll();

    // Realtime subscribe
    try {
      window.__supabase
        .channel('summonings-channel')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'summonings' }, payload => {
          addSummoningToUI(payload.new);
        })
        .subscribe();
    } catch (err) { console.warn('Realtime subscribe failed', err); }

    // map click -> modal
    map.on('click', e => {
      clickedPos = e.latlng;
      const pulse = document.createElement('div');
      pulse.className = 'map-click-pulse';
      pulse.style.left = (e.containerPoint.x - 30) + 'px';
      pulse.style.top = (e.containerPoint.y - 30) + 'px';
      document.body.appendChild(pulse);
      setTimeout(()=>pulse.remove(), 800);

      const modal = document.getElementById('ritualModal');
      modal.style.display = 'flex';
      document.getElementById('avatarPreview').src = 'ritualnet-logo.png';
      document.getElementById('username').value = '';
      document.getElementById('pledge').value = '';
      setTimeout(()=>document.getElementById('username').focus(), 120);
    });

    document.getElementById('titleLink').onclick = () => window.open('https://x.com/ritualnet', '_blank');

    // avatar preview
    document.querySelector('.upload-btn')?.addEventListener('click', ()=>document.getElementById('avatarInput').click());
    document.getElementById('avatarInput')?.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => document.getElementById('avatarPreview').src = ev.target.result;
      reader.readAsDataURL(file);
    });

    // join
    document.querySelector('.join-btn')?.addEventListener('click', async () => {
      const avatar = document.getElementById('avatarPreview').src;
      const name = (document.getElementById('username').value || "ritualist").trim();
      const pledge = (document.getElementById('pledge').value || "I have joined.").trim();
      if (!clickedPos) return;
      const newSummon = { name, pledge, avatar, lat: clickedPos.lat, lng: clickedPos.lng, timestamp: Date.now() };
      try {
        const { data, error } = await window.__supabase.from('summonings').insert(newSummon).select();
        if (error) { console.error('Insert error', error); return; }
        if (!data || !data[0]) return;
        document.getElementById('ritualModal').style.display = 'none';
        const success = document.getElementById('success');
        success.style.display = 'flex';
        setTimeout(()=>{ success.style.display='none'; map.flyTo(clickedPos, 10, {duration:1.6}); }, 2500);
        addSummoningToUI(data[0]);
      } catch (err) { console.error('join error', err); }
    });

    // collapse toggle behavior
    const panel = document.getElementById('panel');
    const toggle = document.getElementById('panelToggle');
    let collapsed = false;
    function setCollapsed(state) {
      collapsed = state;
      if (collapsed) {
        // hide list but keep header
        panel.style.height = 'auto';
        recent.style.display = 'none';
        toggle.innerText = 'Show';
        toggle.setAttribute('aria-expanded', 'false');
        // give a subtle transform so it feels "compact"
        panel.style.opacity = '0.95';
      } else {
        recent.style.display = 'block';
        toggle.innerText = 'Hide';
        toggle.setAttribute('aria-expanded', 'true');
        panel.style.opacity = '1';
      }
    }
    // default: expanded on desktop, collapsed on very small screens
    if (window.matchMedia && window.matchMedia('(max-width:420px)').matches) {
      setCollapsed(false); // keep expanded but small; user can hide if they want
    } else {
      setCollapsed(false);
    }
    toggle.addEventListener('click', ()=> setCollapsed(!collapsed));

    // small modal / close logic (close button and overlay)
    document.getElementById('closeBtn')?.addEventListener('click', ()=> { document.getElementById('ritualModal').style.display='none'; clickedPos=null; });
    document.querySelector('.modal')?.addEventListener('click', e => { if (e.target.classList.contains('modal')) { document.getElementById('ritualModal').style.display='none'; clickedPos=null; } });

    // optionally show only top 3 visible in panel height by CSS; more items are scrollable.
    // nothing else required.

    // keep map sizing tuned in case some browsers need a delayed set
    setTimeout(()=>{ try{ const vh = window.innerHeight; document.getElementById('map').style.height = vh + 'px'; }catch(e){} }, 450);

  </script>
</body>
</html>
