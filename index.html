<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>RITUALNET</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
    html, body {
      margin:0; padding:0;
      background:#000!important; color:#0f0;
      height:100%; min-height:100%;
      font-family:'Rajdhani',sans-serif;
      -webkit-text-size-adjust:100%;
      overflow:hidden;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
    }
    *{box-sizing:border-box;}
    #map{
      position:fixed; inset:0;
      width:100%; height:100%;
      background:#000;
      z-index:1;
    }
    .leaflet-control-zoom,.leaflet-control-attribution{display:none!important;}

    .title-bar{
      position:absolute;top:0;left:0;right:0;height:100px;
      background:linear-gradient(to bottom,rgba(0,30,0,0.95),transparent);
      display:flex;align-items:center;justify-content:center;gap:20px;
      z-index:100;user-select:none;padding-top:env(safe-area-inset-top);
    }
    #ritualLogo{width:70px;height:70px;cursor:pointer;filter:drop-shadow(0 0 40px #00ff41);}
    .title-text{font-family:'Orbitron',sans-serif;font-size:48px;font-weight:900;background:linear-gradient(90deg,#00ff41,#00ff99);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px #00ff4188;letter-spacing:8px;}
    .subtitle{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-size:14px;color:#00ff88;text-shadow:0 0 20px #00ff41;font-family:'Orbitron',sans-serif;}

    /* Panel */
    .panel{
      position:absolute;left:16px;bottom:16px;
      width:340px;max-width:calc(100vw - 32px);
      background:#000;border:3px solid #00ff41;border-radius:20px;
      padding:14px;box-shadow:0 0 80px rgba(0,255,65,0.6);
      z-index:10;display:flex;flex-direction:column;
    }
    .panel h3{
      font-family:'Orbitron',sans-serif;color:#00ff41;font-size:22px;text-align:center;margin-bottom:10px;
    }
    #recent{
      max-height:40vh;
      overflow-y:auto;
      scroll-behavior:smooth;
    }
    .entry{
      display:flex;align-items:center;margin:6px 0;padding:8px 10px;
      background:rgba(0,255,65,0.05);border:2px solid #00ff41;border-radius:14px;
    }
    .entry img{
      width:42px;height:42px;border-radius:50%;
      border:3px solid #00ff41;margin-right:10px;box-shadow:0 0 20px #00ff4188;
    }
    .entry .name{font-family:'Orbitron',sans-serif;color:#00ff88;font-size:15px;}
    .entry .pledge{font-size:12px;color:#00ff88;opacity:0.9;}

    /* Modal */
    .modal{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.95);
      display:none;align-items:center;justify-content:center;
      z-index:200;backdrop-filter:blur(10px);
    }
    .card{
      background:#000;border:3px solid #00ff41;border-radius:20px;
      padding:40px 30px;text-align:center;box-shadow:0 0 100px rgba(0,255,65,0.7);
      width:380px;max-width:95vw;
    }
    .close-btn{
      position:absolute;top:20px;right:25px;width:40px;height:40px;
      background:transparent;border:2px solid #00ff41;border-radius:50%;
      color:#00ff41;font-size:22px;cursor:pointer;
    }
    .avatar-circle{
      width:120px;height:120px;border-radius:50%;border:5px solid #00ff41;margin:20px auto;overflow:hidden;
      box-shadow:0 0 40px #00ff41;
    }
    .avatar-circle img{width:100%;height:100%;object-fit:cover;}
    .upload-btn,.input-field,.pledge-field{
      width:100%;padding:14px;margin:10px 0;background:#001100;border:2px dashed #00ff41;border-radius:16px;color:#00ff88;font-size:16px;text-align:center;
    }
    .pledge-field{height:80px;text-align:left;resize:none;}
    .join-btn{
      margin-top:20px;padding:16px 60px;background:#00ff41;color:#000;border:none;border-radius:40px;font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;cursor:pointer;
      box-shadow:0 0 60px #00ff41;
    }

    .success{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:#000;display:none;align-items:center;justify-content:center;
      flex-direction:column;z-index:300;color:#00ff41;text-align:center;
    }
    .success h1{font-family:'Orbitron',sans-serif;font-size:48px;text-shadow:0 0 40px #00ff41;}

    @media(max-width:420px){
      .panel{width:90%;left:5%;bottom:14px;}
      #recent{max-height:35vh;}
      .title-text{font-size:32px;letter-spacing:4px;}
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="title-bar">
    <div id="ritualLogo"><img src="ritualnet-logo.png" width="70"></div>
    <div class="title-text" id="titleLink">RITUALNET</div>
  </div>
  <div class="subtitle">Let’s Make The World Ritualize</div>

  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent"></div>
  </div>

  <div class="modal" id="ritualModal">
    <div class="card">
      <button class="close-btn" id="closeBtn">X</button>
      <h2 style="font-family:'Orbitron';color:#00ff41;">PERFORM THE RITUAL</h2>
      <div class="avatar-circle"><img src="ritualnet-logo.png" id="avatarPreview"></div>
      <label class="upload-btn" id="uploadLabel">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field" id="pledge" placeholder="Speak your pledge..."></textarea>
      <button class="join-btn" id="joinBtn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <div class="success" id="success">
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://xgttfiqewnwpqguhbpgv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndHRmaXFld253cHFndWhicGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxOTY1ODgsImV4cCI6MjA3ODc3MjU4OH0.zVK46pTGH0_Ruu20s35ep8NnsQd2ROenG_EuWezXiWg';
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.__supabase = supabase;

    function fixHeight(){
      const vh = window.innerHeight;
      document.getElementById('map').style.height = vh + 'px';
    }
    window.addEventListener('resize', fixHeight);
    fixHeight();

    const map = L.map('map',{zoomControl:false,attributionControl:false,minZoom:2,maxZoom:19}).setView([10,0],2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    const markers = L.layerGroup().addTo(map);
    const recent = document.getElementById('recent');
    let clickedPos=null;

    function getSize(){
      const z=map.getZoom();
      if(z<=3)return 30;if(z<=5)return 40;if(z<=7)return 50;return 65;
    }
    function createIcon(src){
      const s=getSize();
      return L.divIcon({className:'ritual-marker',html:`<img src="${src}" style="width:${s}px;height:${s}px;border-radius:50%;border:3px solid #00ff41;">`,iconSize:[s,s],iconAnchor:[s/2,s/2]});
    }
    function addSummoningToUI(s){
      if(!s)return;
      const avatar=s.avatar||'ritualnet-logo.png';
      const m=L.marker([s.lat,s.lng],{icon:createIcon(avatar)}).addTo(markers);
      m.bindPopup(`<div style="text-align:center;"><img src="${avatar}" width="60" height="60" style="border-radius:50%;border:3px solid #00ff41;"><br><b>@${s.name}</b><br><i>"${s.pledge}"</i></div>`);
      const entry=document.createElement('div');
      entry.className='entry';
      entry.innerHTML=`<img src="${avatar}"><div><div class="name">@${s.name}</div><div class="pledge">"${s.pledge}"</div></div>`;
      recent.prepend(entry); // newest on top ✅
      while(recent.children.length>50){recent.removeChild(recent.lastChild);}
    }

    async function loadAll(){
      const {data,error}=await window.__supabase.from('summonings').select('*').order('timestamp',{ascending:false}).limit(200);
      if(error){console.error(error);return;}
      markers.clearLayers();recent.innerHTML='';
      data.forEach(addSummoningToUI);
    }
    loadAll();

    window.__supabase
      .channel('summonings-channel')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'summonings'},payload=>{
        addSummoningToUI(payload.new);
      })
      .subscribe();

    map.on('click',e=>{
      clickedPos=e.latlng;
      const modal=document.getElementById('ritualModal');
      modal.style.display='flex';
      document.getElementById('avatarPreview').src='ritualnet-logo.png';
      document.getElementById('username').value='';
      document.getElementById('pledge').value='';
      setTimeout(()=>document.getElementById('username').focus(),100);
    });

    document.getElementById('closeBtn').onclick=()=>{document.getElementById('ritualModal').style.display='none';clickedPos=null;};
    document.getElementById('uploadLabel').onclick=()=>document.getElementById('avatarInput').click();
    document.getElementById('avatarInput').onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=ev=>document.getElementById('avatarPreview').src=ev.target.result;
      r.readAsDataURL(f);
    };

    document.getElementById('joinBtn').onclick=async()=>{
      if(!clickedPos)return;
      const avatar=document.getElementById('avatarPreview').src;
      const name=(document.getElementById('username').value||"ritualist").trim();
      const pledge=(document.getElementById('pledge').value||"I have joined.").trim();
      const summon={name,pledge,avatar,lat:clickedPos.lat,lng:clickedPos.lng,timestamp:Date.now()};
      const {data,error}=await window.__supabase.from('summonings').insert(summon).select();
      if(error){console.error(error);alert('Failed to join');return;}
      document.getElementById('ritualModal').style.display='none';
      const success=document.getElementById('success');
      success.style.display='flex';
      setTimeout(()=>success.style.display='none',2500);
      addSummoningToUI(data[0]);
    };

    document.getElementById('titleLink').onclick=()=>window.open('https://x.com/ritualnet','_blank');
  </script>
</body>
</html>
