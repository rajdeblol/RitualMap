
<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>RITUAL NET: NEON ALTAR</title>

 <!-- Leaflet -->
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

 <!-- Google Fonts: Orbitron (header), VT323 (text) -->
 <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=VT323&display=swap" rel="stylesheet">

 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body {
 background: #000;
 color: #0f0;
 font-family: 'VT323', monospace;
 overflow: hidden;
 height: 100vh;
 background: 
 radial-gradient(circle at 50% 50%, #001100 0%, #000 70%),
 repeating-linear-gradient(45deg, #000 0px, #001100 1px, #000 2px);
 }

 /* ===== HEADER ===== */
 #header {
 position: fixed;
 top: 0; left: 0; right: 0;
 padding: 15px;
 text-align: center;
 z-index: 1000;
 background: rgba(0,0,0,0.9);
 border-bottom: 2px solid #0f0;
 text-shadow: 0 0 10px #0f0;
 }
 #header h1 {
 font-family: 'Orbitron', sans-serif;
 font-size: 2.8rem;
 color: #0f0;
 text-shadow: 0 0 15px #0f0, 0 0 30px #0f0;
 animation: neonPulse 2s infinite;
 }
 #counter {
 font-size: 1.3rem;
 color: #0f8;
 margin-top: 5px;
 animation: scanline 3s infinite;
 }

 /* ===== MAP ===== */
 #map {
 position: absolute;
 top: 0; left: 0; right: 0; bottom: 0;
 z-index: 1;
 }

 /* ===== MODAL ===== */
 .modal {
 position: fixed;
 top: 0; left: 0; right: 0; bottom: 0;
 background: rgba(0,0,0,0.98);
 display: flex;
 align-items: center;
 justify-content: center;
 z-index: 2000;
 opacity: 0;
 pointer-events: none;
 transition: opacity 0.7s;
 }
 .modal.active { opacity: 1; pointer-events: all; }

 .modal-content {
 background: #000;
 border: 3px solid #0f0;
 padding: 30px;
 width: 90%;
 max-width: 520px;
 border-radius: 8px;
 box-shadow: 
 0 0 20px #0f0,
 inset 0 0 40px rgba(0,255,0,0.1);
 animation: float 5s infinite ease-in-out;
 text-align: center;
 }

 h2 {
 font-family: 'Orbitron', sans-serif;
 color: #0f0;
 margin: 15px 0;
 text-shadow: 0 0 10px #0f0;
 }

 input, textarea, button {
 font-family: 'VT323', monospace;
 font-size: 1.2rem;
 }

 input[type="text"], textarea {
 background: #001100;
 color: #0f0;
 border: 2px solid #0f0;
 padding: 12px;
 width: 100%;
 margin: 12px 0;
 border-radius: 4px;
 box-shadow: 0 0 10px rgba(0,255,0,0.3);
 }

 input::placeholder, textarea::placeholder {
 color: #0a0;
 }

 /* PFP Upload */
 #pfpPreview {
 width: 120px; height: 120px;
 border-radius: 50%;
 object-fit: cover;
 border: 3px solid #0f0;
 box-shadow: 0 0 20px #0f0;
 margin: 15px auto;
 display: block;
 animation: glitch 2s infinite;
 }

 /* Location Picker */
 #locationPicker {
 height: 200px;
 border: 2px solid #0f0;
 margin: 15px 0;
 border-radius: 4px;
 box-shadow: 0 0 15px #0f0;
 }

 button {
 background: #000;
 color: #0f0;
 border: 2px solid #0f0;
 padding: 12px 25px;
 margin: 10px;
 cursor: pointer;
 transition: all 0.3s;
 text-shadow: 0 0 8px #0f0;
 box-shadow: 0 0 10px rgba(0,255,0,0.5);
 }
 button:hover:not(:disabled) {
 background: #0f0;
 color: #000;
 box-shadow: 0 0 25px #0f0;
 transform: translateY(-2px);
 }
 button:disabled {
 opacity: 0.4;
 cursor: not-allowed;
 }

 /* ===== ANIMATIONS ===== */
 @keyframes neonPulse {
 0%, 100% { text-shadow: 0 0 15px #0f0, 0 0 30px #0f0; }
 50% { text-shadow: 0 0 25px #0f0, 0 0 50px #0f0, 0 0 70px #0f0; }
 }
 @keyframes scanline {
 0%, 100% { opacity: 1; }
 50% { opacity: 0.7; }
 }
 @keyframes float {
 0%, 100% { transform: translateY(0); }
 50% { transform: translateY(-10px); }
 }
 @keyframes glitch {
 0%, 100% { clip-path: inset(0 0 0 0); }
 25% { clip-path: inset(5% 0 90% 0); transform: translateX(2px); }
 50% { clip-path: inset(90% 0 5% 0); transform: translateX(-2px); }
 75% { clip-path: inset(30% 0 60% 0); }
 }
 @keyframes bloodBloom {
 0% { transform: scale(0); opacity: 1; }
 100% { transform: scale(4); opacity: 0; }
 }

 .blood-bloom {
 position: absolute;
 width: 80px; height: 80px;
 background: radial-gradient(circle, #0f0 5%, #0a0 30%, transparent 70%);
 border-radius: 50%;
 pointer-events: none;
 animation: bloodBloom 1.8s ease-out forwards;
 z-index: 999;
 box-shadow: 0 0 30px #0f0;
 }

 /* Cursor */
 body { cursor: crosshair; }
 </style>
</head>
<body>

 <!-- HEADER -->
 <div id="header">
 <h1>RITUAL NET: NEON ALTAR</h1>
 <div id="counter">0.0000% of Earth claimed</div>
 </div>

 <!-- MAP -->
 <div id="map"></div>

 <!-- MODAL -->
 <div id="pledgeModal" class="modal active">
 <div class="modal-content">
 <h2>STEP 1: ENTER X USERNAME</h2>
 <input type="text" id="usernameInput" placeholder="@yourname" />

 <h2>STEP 2: UPLOAD PFP</h2>
 <input type="file" id="pfpInput" accept="image/*" />
 <img id="pfpPreview" src="" alt="PFP Preview" style="display:none;" />

 <h2>STEP 3: SET LOCATION</h2>
 <div id="locationPicker"></div>
 <p><small>Click map to place your node</small></p>

 <h2>STEP 4: TYPE THE PLEDGE</h2>
 <textarea id="pledgeInput" placeholder="I, @yourname, bind my feed..."></textarea>
 <button id="vowBtn" disabled>VOW</button>

 <div id="success" style="display:none; margin-top:20px;">
 <h2>NODE ACTIVATED</h2>
 <p>Your summon link:</p>
 <input type="text" id="summonLink" readonly />
 <button onclick="copyLink()">COPY</button>
 <button id="closeModal">ENTER THE NET</button>
 </div>
 </div>
 </div>

 <script>
 // ===== MAP SETUP =====
 const map = L.map('map').setView([20, 0], 2);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
 maxZoom: 19,
 attribution: '© OpenStreetMap'
 }).addTo(map);

 // Neon filter
 map.getContainer().style.filter = 'contrast(1.3) brightness(1.1)';

 // Location picker map
 const pickerMap = L.map('locationPicker').setView([0, 0], 2);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(pickerMap);
 let marker = null;
 let selectedLatLng = null;

 pickerMap.on('click', (e) => {
 if (marker) pickerMap.removeLayer(marker);
 marker = L.marker(e.latlng).addTo(pickerMap);
 selectedLatLng = e.latlng;
 document.getElementById('vowBtn').disabled = false;
 });

 // Fake DB
 let users = JSON.parse(localStorage.getItem('ritualUsers')) || [];
 users.forEach(u => addPin(u.lat, u.lng, u.username, u.pfp));
 updateCounter();

 // Elements
 const usernameInput = document.getElementById('usernameInput');
 const pfpInput = document.getElementById('pfpInput');
 const pfpPreview = document.getElementById('pfpPreview');
 const pledgeInput = document.getElementById('pledgeInput');
 const vowBtn = document.getElementById('vowBtn');
 const successDiv = document.getElementById('success');
 const summonLink = document.getElementById('summonLink');

 let currentUser = {};

 // PFP Upload
 pfpInput.addEventListener('change', (e) => {
 const file = e.target.files[0];
 if (file) {
 const reader = new FileReader();
 reader.onload = (ev) => {
 pfpPreview.src = ev.target.result;
 pfpPreview.style.display = 'block';
 currentUser.pfp = ev.target.result;
 };
 reader.readAsDataURL(file);
 }
 });

 // Username + Pledge
 usernameInput.addEventListener('input', updatePledge);
 function updatePledge() {
 const name = usernameInput.value.trim().replace('@', '');
 if (name) {
 currentUser.username = name;
 const oath = `I, @${name}, bind my feed to the Ritual Net. My posts are code. My silence is signal. The Net will echo me forever.`;
 pledgeInput.placeholder = oath;
 currentUser.oath = oath;
 }
 }

 // VOW
 vowBtn.onclick = () => {
 const typed = pledgeInput.value.trim();
 if (typed === currentUser.oath && selectedLatLng && currentUser.pfp) {
 const { lat, lng } = selectedLatLng;
 currentUser.lat = lat;
 currentUser.lng = lng;

 addPin(lat, lng, currentUser.username, currentUser.pfp);
 users.push(currentUser);
 localStorage.setItem('ritualUsers', JSON.stringify(users));
 updateCounter();

 // Success
 document.querySelectorAll('input, textarea, button').forEach(el => el.disabled = true);
 successDiv.style.display = 'block';
 summonLink.value = `https://ritual.net/summon/${currentUser.username}`;
 }
 };

 // Pledge typing
 pledgeInput.addEventListener('input', () => {
 vowBtn.disabled = pledgeInput.value.trim() !== currentUser.oath;
 });

 // Add Pin
 function addPin(lat, lng, username, pfp) {
 const icon = L.divIcon({
 html: `<img src="${pfp}" style="width:36px;height:36px;border-radius:50%;border:2px solid #0f0;box-shadow:0 0 15px #0f0;">`,
 iconSize: [36, 36],
 className: 'neon-pin'
 });
 L.marker([lat, lng], { icon }).addTo(map)
 .bindPopup(`<b>@${username}</b><br>Node Active`);

 // BLOOD BLOOM
 const bloom = document.createElement('div');
 bloom.className = 'blood-bloom';
 document.body.appendChild(bloom);
 const rect = map.latLngToContainerPoint([lat, lng]);
 bloom.style.left = (rect.x - 40) + 'px';
 bloom.style.top = (rect.y - 40) + 'px';
 setTimeout(() => bloom.remove(), 1800);
 }

 // Counter
 function updateCounter() {
 const percent = ((users.length / 8000000000) * 100).toFixed(6);
 document.getElementById('counter').textContent = `${percent}% of Earth claimed`;
 }

 // Copy
 window.copyLink = () => {
 summonLink.select();
 document.execCommand('copy');
 alert("SUMMON LINK COPIED. INFECT THE GRID.");
 };

 // Close
 document.getElementById('closeModal').onclick = () => {
 document.getElementById('pledgeModal').classList.remove('active');
 };

 // Global pulse
 setInterval(() => {
 document.body.style.boxShadow = 'inset 0 0 50px #0f0';
 setTimeout(() => document.body.style.boxShadow = 'none', 300);
 }, 7000);
 </script>
</body>
</html>
