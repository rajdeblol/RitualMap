<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RITUALNET</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    body { margin:0; background:#000; overflow:hidden; height:100vh; font-family:'Rajdhani',sans-serif; }

    #map { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; }
    .leaflet-control-zoom { display:none !important; }

    .header {
      position:absolute; top:0; left:0; right:0; height:90px;
      background:linear-gradient(to bottom,rgba(0,30,0,0.98),transparent);
      display:flex; align-items:center; justify-content:center; z-index:10;
    }
    .logo {
      font-family:'Orbitron',sans-serif; font-size:50px; font-weight:900;
      background:linear-gradient(90deg,#00ff41,#00ff88);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      text-shadow:0 0 50px #00ff4188;
      letter-spacing:10px;
    }

    /* Ritual Modal - EXACT MATCH TO YOUR DESIGN */
    .modal {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.98); backdrop-filter:blur(20px);
      display:none; align-items:center; justify-content:center; z-index:100;
    }
    .card {
      width:420px; background:#000; padding:50px 40px;
      border:3px solid #00ff41; border-radius:30px;
      text-align:center; position:relative;
      box-shadow:0 0 100px rgba(0,255,65,0.7);
    }
    .close-btn {
      position:absolute; top:20px; right:25px;
      width:40px; height:40px; background:transparent;
      border:2px solid #00ff41; border-radius:50%;
      color:#00ff41; font-size:28px; font-weight:bold;
      cursor:pointer; transition:0.3s;
    }
    .close-btn:hover { background:#00ff4111; transform:rotate(90deg); }

    .card h2 {
      font-family:'Orbitron',sans-serif; color:#00ff41; font-size:42px;
      text-shadow:0 0 30px #00ff41; margin-bottom:40px; letter-spacing:8px;
    }

    .avatar-circle {
      width:140px; height:140px; border-radius:50%;
      margin:30px auto; border:6px solid #00ff41;
      overflow:hidden; box-shadow:0 0 60px #00ff4188;
      background:#000;
    }
    .avatar-circle img {
      width:100%; height:100%; object-fit:cover;
    }

    .upload-btn, .input-field, .pledge-field {
      width:100%; padding:18px; margin:18px 0;
      background:#001100; border:2px dashed #00ff41;
      border-radius:20px; color:#00ff88; font-size:18px;
      text-align:center; cursor:pointer; transition:0.3s;
    }
    .upload-btn:hover, .input-field:focus, .pledge-field:focus {
      background:#002200; outline:none; border-style:solid;
    }
    .pledge-field { height:100px; resize:none; text-align:left; padding:20px; }

    .join-btn {
      margin-top:30px; padding:20px 80px;
      background:#00ff41; color:#000; border:none;
      border-radius:50px; font-family:'Orbitron',sans-serif;
      font-size:28px; font-weight:900; cursor:pointer;
      box-shadow:0 0 60px #00ff41; transition:0.4s;
    }
    .join-btn:hover { transform:scale(1.1); box-shadow:0 0 100px #00ff41; }

    /* Success Screen */
    .success {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:#000; display:none; align-items:center; justify-content:center;
      flex-direction:column; z-index:200; text-align:center; color:#00ff41;
    }
    .success h1 {
      font-family:'Orbitron',sans-serif; font-size:70px; margin-bottom:20px;
      text-shadow:0 0 60px #00ff41; animation:pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{text-shadow:0 0 60px #00ff41} 50%{text-shadow:0 0 120px #00ff41} }

    /* Recent Panel */
    .panel {
      position:absolute; left:20px; bottom:30px; width:400px;
      background:rgba(0,20,0,0.96); border:2px solid #00ff41; border-radius:20px;
      padding:25px; box-shadow:0 0 70px rgba(0,255,65,0.5); z-index:10;
    }
    .panel h3 {
      font-family:'Orbitron',sans-serif; color:#00ff41; font-size:28px;
      text-shadow:0 0 20px; margin-bottom:20px;
    }
    .entry {
      display:flex; align-items:center; margin:15px 0;
      padding:12px; background:rgba(0,255,65,0.08);
      border-left:5px solid #00ff41; border-radius:0 15px 15px 0;
    }
    .entry img {
      width:50px; height:50px; border-radius:50%; border:3px solid #00ff41;
      margin-right:15px; box-shadow:0 0 30px #00ff4188;
    }
    .entry .name { color:#00ff88; font-weight:bold; font-family:'Orbitron',sans-serif; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="header"><div class="logo">RITUALNET</div></div>

  <!-- Recent Summonings -->
  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent"></div>
  </div>

  <!-- Ritual Modal -->
  <div class="modal" id="ritualModal">
    <div class="card">
      <div class="close-btn" id="closeBtn">×</div>
      <h2>PERFORM THE RITUAL</h2>
      
      <div class="avatar-circle">
        <img src="" alt="" id="avatarPreview">
      </div>
      
      <label class="upload-btn">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">

      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field input-field" id="pledge" placeholder="Speak your pledge..."></textarea>

      <button class="join-btn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <!-- Success -->
  <div class="success" id="success">
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([10, 0], 2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: ''
    }).addTo(map);

    const markers = L.layerGroup().addTo(map);
    const recent = document.getElementById('recent');
    let summonings = [];
    let clickedPos = null;

    // Open modal on map click
    map.on('click', e => {
      clickedPos = e.latlng;
      document.getElementById('ritualModal').style.display = 'flex';
      document.getElementById('avatarPreview').src = '';
      document.getElementById('username').value = '';
      document.getElementById('pledge').value = '';
    });

    // Close modal
    const closeModal = () => {
      document.getElementById('ritualModal').style.display = 'none';
      clickedPos = null;
    };
    document.getElementById('closeBtn').onclick = closeModal;
    document.querySelector('.modal').onclick = (e) => {
      if (e.target.classList.contains('modal')) closeModal();
    };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // Avatar upload
    document.querySelector('.upload-btn').onclick = () => document.getElementById('avatarInput').click();
    document.getElementById('avatarInput').onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => document.getElementById('avatarPreview').src = ev.target.result;
        reader.readAsDataURL(file);
      }
    };

    // Submit
    document.querySelector('.join-btn').onclick = () => {
      const avatar = document.getElementById('avatarPreview').src;
      const name = document.getElementById('username').value.trim() || "ritualist";
      const pledge = document.getElementById('pledge').value.trim() || "I have joined.";

      if (!avatar || !clickedPos) return;

      // Add marker
      const icon = L.divIcon({
        html: `<img src="${avatar}" style="width:56px;height:56px;border-radius:50%;border:4px solid #00ff41;box-shadow:0 0 40px #00ff4188;">`,
        iconSize: [56,56], iconAnchor: [28,56]
      });
      L.marker(clickedPos, { icon }).addTo(markers)
        .bindPopup(`<div style="color:#0f0;background:#000;padding:16px;border:3px solid #0f0;border-radius:20px;text-align:center;">
          <img src="${avatar}" width="80" style="border-radius:50%;border:4px solid #0f0;margin-bottom:10px;">
          <br><b style="color:#00ff41;">@${name}</b><br><i>"${pledge}"</i>
        </div>`).openPopup();

      // Recent
      summonings.push({ name, pledge, avatar });
      if (summonings.length > 3) summonings.shift();
      recent.innerHTML = '';
      summonings.slice().reverse().forEach(s => {
        recent.innerHTML += `<div class="entry">
          <img src="${s.avatar}"><div><div class="name">@${s.name}</div>"${s.pledge}"</div>
        </div>`;
      });

      // Success + close
      closeModal();
      document.getElementById('success').style.display = 'flex';
      setTimeout(() => {
        document.getElementById('success').style.display = 'none';
        map.setView(clickedPos, 10, { animate: true });
      }, 3000);
    };
  </script>
</body>
</html>
