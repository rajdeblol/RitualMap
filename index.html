<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RITUALNET</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* (Your original CSS untouched) */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
    *, *::before, *::after {margin:0;padding:0;box-sizing:border-box;}
    html, body {
      margin: 0; padding: 0; background: #000; overflow: hidden;
      height: 100dvh; width: 100vw; font-family: 'Rajdhani', sans-serif;
      color: #0f0; touch-action: manipulation; position: fixed;
    }
    #map { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; z-index: 1; }
    .leaflet-control-zoom, .leaflet-control-attribution {display: none !important;}
    /* ... rest of your original CSS exactly ... */
    .title-bar{position:fixed;top:0;left:0;right:0;height:110px;background:linear-gradient(to bottom, rgba(0,30,0,0.98), transparent);display:flex;align-items:center;justify-content:center;gap:15px;z-index:100;user-select:none;padding-top:env(safe-area-inset-top);flex-wrap:wrap;padding:10px;}
    #ritualLogo{width:70px;height:70px;cursor:pointer;filter:drop-shadow(0 0 40px #00ff41);animation:glow 5s infinite alternate;transition:0.3s;position:relative;flex-shrink:0;}
    #ritualLogo img{width:100%;height:100%;position:absolute;top:0;left:0;z-index:2;}
    #ritualLogo::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68%;height:68%;background:url('ritualnet-logo.png') center/contain no-repeat;opacity:0.18;z-index:-1;pointer-events:none;animation:ritualPulse 6s infinite ease-in-out;}
    #ritualLogo:hover{transform:scale(1.25);}
    .title-text{font-family:'Orbitron',sans-serif;font-weight:900;background:linear-gradient(90deg,#00ff41,#00ff99);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px #00ff4188;letter-spacing:8px;cursor:pointer;position:relative;font-size:clamp(36px,8vw,56px);white-space:nowrap;text-align:center;}
    .title-text::before{content:'RITUALNET';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:inherit;letter-spacing:8px;opacity:0.18;background:linear-gradient(90deg,#00ff41,#00ff99);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ritualPulse 6s infinite ease-in-out;z-index:-1;}
    .subtitle{position:fixed;top:calc(110px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:2px;color:#00ff88;text-shadow:0 0 20px #00ff41;font-family:'Orbitron',sans-serif;white-space:nowrap;z-index:100;}
    @keyframes glow{0%{filter:drop-shadow(0 0 30px #00ff41);}100%{filter:drop-shadow(0 0 70px #00ff41);}}
    @keyframes ritualPulse{0%,100%{opacity:0.15;transform:translate(-50%,-50%) scale(1);}50%{opacity:0.25;transform:translate(-50%,-50%) scale(1.08);}}
    .modal{position:fixed;top:0;left:0;width:100%;height:100dvh;background:rgba(0,0,0,0.98);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
    .card{width:430px;max-width:95vw;background:#000;padding:50px 40px;border:3px solid #00ff41;border-radius:30px;text-align:center;position:relative;box-shadow:0 0 100px rgba(0,255,65,0.7);}
    .close-btn{position:absolute;top:20px;right:25px;width:40px;height:40px;background:transparent;border:2px solid #00ff41;border-radius:50%;color:#00ff41;font-size:28px;cursor:pointer;}
    .close-btn:hover{background:#00ff4111;transform:rotate(90deg);}
    .card h2{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:42px;text-shadow:0 0 30px #00ff41;margin-bottom:40px;letter-spacing:8px;}
    .avatar-circle{width:140px;height:140px;border-radius:50%;margin:30px auto;border:6px solid #00ff41;overflow:hidden;background:#000;box-shadow:0 0 60px #00ff4188;position:relative;}
    .avatar-circle img{width:100%;height:100%;object-fit:cover;z-index:2;}
    .avatar-circle::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68%;height:68%;background:url('ritualnet-logo.png') center/contain no-repeat;opacity:0.18;z-index:1;pointer-events:none;animation:ritualPulse 6s infinite ease-in-out;}
    .upload-btn,.input-field,.pledge-field{width:100%;padding:18px;margin:18px 0;background:#001100;border:2px dashed #00ff41;border-radius:20px;color:#00ff88;font-size:18px;text-align:center;cursor:pointer;transition:0.3s;}
    .upload-btn:hover,.input-field:focus,.pledge-field:focus{background:# P002200;border-style:solid;outline:none;}
    .pledge-field{height:100px;resize:none;text-align:left;padding:20px;}
    .join-btn{margin-top:30px;padding:20px 80px;background:#00ff41;color:#000;border:none;border-radius:50px;font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 0 60px #00ff41;transition:0.4s;}
    .join-btn:hover{transform:scale(1.1);box-shadow:0 0 100px #00ff41;}
    .success{position:fixed;top:0;left:0;width:100%;height:100dvh;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:300;color:#00ff41;text-align:center;opacity:0;transition:opacity 0.6s ease;padding:20px;}
    .success.active{display:flex;opacity:1;}
    .success h1{font-family:'Orbitron',sans-serif;font-size:clamp(48px,12vw,64px);text-shadow:0 0 60px #00ff41;margin:0;position:relative;z-index:2;animation:fadeInUp 1.2s ease-out forwards;}
    .success p{margin-top:20px;font-size:clamp(16px,4vw,20px);opacity:0;animation:fadeIn 1s ease 0.8s forwards;z-index:2;}
    .ritual-circle{position:absolute;width:300px;height:300px;border:3px solid #00ff41;border-radius:50%;box-shadow:0 0 80px #00ff41,inset 0 0 60px #00ff41;animation:expandGlow 2.5s ease-out forwards;opacity:0;z-index:1;top:50%;left:50%;transform:translate(-50%,-50%);}
    @keyframes expandGlow{0%{width:0;height:0;opacity:1;}70%{width:400px;height:400px;opacity:0.6;}100%{width:500px;height:500px;opacity:0;}}
    @keyframes fadeInUp{0%{opacity:0;transform:translateY(30px);}100%{opacity:1;transform:translateY(0);}}@keyframes fadeIn{to{opacity:0.8;}}
    .panel{position:fixed;left:15px;bottom:15px;width:300px;max-width:calc(100vw - 30px);max-height:240px;background:#000;border:3px solid #00ff41;border-radius:20px;padding:12px;box-shadow:0 0 60px rgba(0,255,65,0.6);z-index:10;overflow-y:auto;display:flex;flex-direction:column;scroll-behavior:smooth;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom);}
    .panel h3{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:18px;text-shadow:0 0 20px #00ff41;margin-bottom:8px;text-align:center;background:#001100;padding:8px;border-radius:15px;box-shadow:0 0 30px #00ff41 inset;font-weight:900;}
    .entry{display:flex;align-items:center;margin:8px 0;padding:10px;background:rgba(0,255,65,0.08);border:2px solid #00ff41;border-radius:15px;position:relative;flex-shrink:0;scroll-snap-align:start;}
    .entry img{width:36px;height:36px;border-radius:50%;border:2px solid #00ff41;margin-right:10px;box-shadow:0 0 20px #00ff4188;z-index:2;}
    .entry::before{content:'';position:absolute;top:50%;left:18px;transform:translate(-50%,-50%);width:28px;height:28px;background:url('ritualnet-logo.png') center/contain no-repeat;opacity:0.18;z-index:1;pointer-events:none;animation:ritualPulse 5s infinite ease-in-out;}
    .entry .name{color:#00ff88;font-weight:bold;font-family:'Orbitron',sans-serif;font-size:14px;text-align:left;flex:1;}
    .entry .pledge{color:#00ff88;font-size:12px;margin-top:2px;text-align:left;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ritual-marker img{border-radius:50%;border:4px solid #00ff41;box-shadow:0 0 30px #00ff41;z-index:2;}
    .ritual-marker::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60%;height:60%;background:url('ritualnet-logo.png') center/contain no-repeat;opacity:0.18;z-index:1;pointer-events:none;animation:ritualPulse 7s infinite ease-in-out;}
    #resetConfirm{position:fixed;top:0;left:0;width:100%;height:100dvh;background:rgba(0,0,0,0.98);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:400;color:#00ff41;text-align:center;font-family:'Orbitron',sans-serif;}
    #resetConfirm button{margin:15px;font-size:22px;padding:14px 50px;border-radius:40px;font-family:'Orbitron',sans-serif;font-weight:900;cursor:pointer;}
    #confirmReset{background:#00ff41;color:#000;box-shadow:0 0 60px #00ff41;}
    #cancelReset{background:#333;color:#00ff41;border:2px solid #00ff41;}
    .leaflet-popup-content-wrapper{background:#000 !important;color:#0f0 !important;border:3px solid #00ff41 !important;border-radius:20px !important;padding:0 !important;box-shadow:0 0 40px rgba(0,255,65,0.6) !important;}
    .leaflet-popup-content{margin:0 !important;padding:12px !important;text-align:center !important;font-family:'Orbitron',sans-serif !important;position:relative;}
    .leaflet-popup-content img{width:70px !important;height:70px !important;border-radius:50% !important;border:3px solid #00ff41 !important;margin-bottom:10px !important;box-shadow:0 0 20px #00ff41 !important;z-index:2;}
    .leaflet-popup-content::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;background:url('ritualnet-logo.png') center/contain no-repeat;opacity:0.18;z-index:1;pointer-events:none;animation:ritualPulse 6s infinite ease-in-out;}
    .leaflet-popup-content b{color:#00ff41 !important;font-size:16px !important;display:block;margin:6px 0;}
    .leaflet-popup-content i{font-size:13px !important;opacity:0.9;display:block;}
    .leaflet-popup-tip{background:#00ff41 !important;box-shadow:0 0 20px #00ff41 !important;}
    .map-click-pulse{position:absolute;width:60px;height:60px;background:rgba(0,255,65,0.4);border-radius:50%;pointer-events:none;z-index:999;animation:clickPulse 0.8s ease-out forwards;}
    @keyframes clickPulse{0%{transform:scale(0);opacity:1;}100%{transform:scale(4);opacity:0;}}
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="title-bar">
    <div id="ritualLogo"><img src="ritualnet-logo.png" alt="Ritual logo"></div>
    <div class="title-text" id="titleLink">RITUALNET</div>
  </div>

  <div class="subtitle">Let’s Make The World Ritualize</div>

  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent" style="scroll-snap-type: y mandatory;"></div>
  </div>

  <div class="modal" id="ritualModal">
    <div class="card">
      <div class="close-btn" id="closeBtn">X</div>
      <h2>PERFORM THE RITUAL</h2>
      <div class="avatar-circle"><img src="ritualnet-logo.png" id="avatarPreview" alt="avatar preview"></div>
      <label class="upload-btn">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field input-field" id="pledge" placeholder="Write your pledge..."></textarea>
      <button class="join-btn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <div class="success" id="success">
    <div class="ritual-circle"></div>
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <div id="resetConfirm">
    <div>RESET THE CIRCLE?</div>
    <button id="confirmReset">BURN IT ALL</button>
    <button id="cancelReset">CANCEL</button>
  </div>

  <script>
    // Supabase init
    const SUPABASE_URL = 'https://xgttfiqewnwpqguhbpgv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndHRmaXFld253cHFndWhicGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxOTY1ODgsImV4cCI6MjA3ODc3MjU4OH0.zVK46pTGH0_Ruu20s35ep8NnsQd2ROenG_EuWezXiWg';
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.__supabase = supabase;

    // run after load to avoid map sizing bugs
    window.addEventListener('load', () => {
      const map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 2, maxZoom: 19 }).setView([10, 0], 2);
      L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      setTimeout(() => map.invalidateSize(), 120);
      window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 80));
      window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 160));

      const markers = L.layerGroup().addTo(map);
      const recent = document.getElementById('recent');
      let clickedPos = null, logoClicks = 0, clickTimer = null;

      function getSize() {
        const z = map.getZoom();
        if (z <= 3) return 30;
        if (z <= 5) return 40;
        if (z <= 7) return 50;
        return 65;
      }
      function createIcon(src) {
        const s = getSize();
        return L.divIcon({ className: 'ritual-marker', html: `<img src="${src}" style="width:${s}px;height:${s}px;">`, iconSize: [s, s], iconAnchor: [s/2, s/2] });
      }

      map.on('zoomend', () => markers.eachLayer(m => { const data = m.options.data; if (data?.avatar) m.setIcon(createIcon(data.avatar)); }));

      // find marker by id or very-close coords
      function findExistingMarker(s) {
        if (!s) return null;
        let found = null;
        markers.eachLayer(m => {
          if (found) return;
          const md = m.options.data || {};
          if (s.id && md.id && String(md.id) === String(s.id)) { found = m; return; }
          if (s.lat != null && s.lng != null && md.lat != null && md.lng != null) {
            const dLat = Math.abs(Number(md.lat) - Number(s.lat));
            const dLng = Math.abs(Number(md.lng) - Number(s.lng));
            if (dLat < 0.0004 && dLng < 0.0004) { found = m; return; }
          }
        });
        return found;
      }

      function updateMarkerAvatar(marker, newAvatar) {
        try {
          if (!marker) return;
          marker.options.data = marker.options.data || {};
          marker.options.data.avatar = newAvatar;
          marker.setIcon(createIcon(newAvatar));
          // update popup content if any
          try { if (marker.getPopup && marker.getPopup()) marker.setPopupContent(`<div style="position:relative;text-align:center;"><img src="${newAvatar}"><b>@${marker.options.data.name || ''}</b><i>"${marker.options.data.pledge || ''}"</i></div>`); } catch(e){}
          // update recent list entry
          try {
            const id = marker.options.data && marker.options.data.id;
            if (id) {
              const entry = document.querySelector(`.entry[data-id="${id}"]`);
              if (entry) { const img = entry.querySelector('img'); if (img) img.src = newAvatar; }
            }
          } catch(e){}
        } catch(e){ console.warn('updateMarkerAvatar failed', e); }
      }

      function addSummoningToUI(s, isLocal=false, options={}) {
        if (!s) return;
        if (!s.id && !s.timestamp) { if (!s.lat || !s.lng) return; }

        // if marker exists, update quickly
        const existing = findExistingMarker(s);
        if (existing) {
          if (s.avatar) updateMarkerAvatar(existing, s.avatar);
          existing.options.data = Object.assign({}, existing.options.data || {}, s);
          // update recents
          if (s.id) {
            const entry = document.querySelector(`.entry[data-id="${s.id}"]`);
            if (entry) {
              const nameEl = entry.querySelector('.name'); const pledgeEl = entry.querySelector('.pledge');
              if (nameEl) nameEl.textContent = '@' + (s.name || existing.options.data.name || 'ritualist');
              if (pledgeEl) pledgeEl.textContent = '"' + (s.pledge || existing.options.data.pledge || '') + '"';
            }
          }
          return;
        }

        // add new marker
        const icon = createIcon(s.avatar || 'ritualnet-logo.png');
        const m = L.marker([s.lat, s.lng], { icon, data: s }).addTo(markers);
        m.bindPopup(`<div style="position:relative;text-align:center;"><img src="${s.avatar || 'ritualnet-logo.png'}"><b>@${s.name}</b><i>"${s.pledge}"</i></div>`);

        const entry = document.createElement('div');
        entry.className = 'entry';
        if (s.id) entry.dataset.id = s.id;
        entry.innerHTML = `<img src="${s.avatar || 'ritualnet-logo.png'}"><div><div class="name">@${s.name}</div><div class="pledge">"${s.pledge}"</div></div>`;
        if (options.toTop) recent.prepend(entry); else recent.appendChild(entry);
      }

      // loadAll: cache-first then DB, newest-first
      async function loadAll() {
        try {
          const cached = localStorage.getItem('ritualnet_summonings');
          if (cached) {
            try {
              const parsed = JSON.parse(cached);
              if (Array.isArray(parsed) && parsed.length) {
                markers.clearLayers(); recent.innerHTML = '';
                parsed.forEach(s => addSummoningToUI(s, false, { toTop:false }));
                console.log('[RITUALNET] loaded from cache', parsed.length);
              }
            } catch(e){ console.warn('cache parse error', e); }
          }

          const { data, error } = await window.__supabase.from('summonings').select('*').order('timestamp', { ascending: false }).limit(100);
          if (error) { console.warn('[RITUALNET] loadAll db error', error); return; }

          try {
            const minimal = (data||[]).slice(0,50).map(d => ({ id:d.id, name:d.name, pledge:d.pledge, avatar:d.avatar, lat:d.lat, lng:d.lng, timestamp:d.timestamp }));
            localStorage.setItem('ritualnet_summonings', JSON.stringify(minimal));
          } catch(e){ console.warn('[RITUALNET] localStorage save failed', e); }

          markers.clearLayers(); recent.innerHTML = '';
          data.forEach(s => addSummoningToUI(s, false, { toTop:false }));
          console.log('[RITUALNET] fresh loadAll done', (data||[]).length);
        } catch(err){ console.warn('[RITUALNET] loadAll error', err); }
      }

      loadAll();

      // realtime + fast fallback setup
      let ritualChannel = null, ritualSubscribed = false, heartbeat = null, realtimeConnected = false, pollingInterval = null;
      const isMobile = /Mobi|Android/i.test(navigator.userAgent);
      const POLL_INTERVAL_MS = isMobile ? 800 : 500; // aggressive: 500ms desktop, 800ms mobile

      function startPolling() {
        if (pollingInterval) return;
        console.warn('[RITUALNET] starting polling every', POLL_INTERVAL_MS, 'ms');
        pollingInterval = setInterval(() => loadAll(), POLL_INTERVAL_MS);
      }
      function stopPolling() { if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; console.log('[RITUALNET] stopped polling'); } }

      function connectRealtime() {
        try {
          ritualSubscribed = false;
          if (ritualChannel) { try { window.__supabase.removeChannel(ritualChannel); } catch(_){} ritualChannel = null; }
          if (heartbeat) { clearInterval(heartbeat); heartbeat = null; }

          ritualChannel = window.__supabase.channel('summonings-channel', { config: { broadcast: { self: false } } });

          ritualChannel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'summonings' }, payload => {
            try {
              const row = payload.new || payload.record || payload;
              // instant update or add
              const existing = findExistingMarker(row);
              if (existing) {
                if (row.avatar) updateMarkerAvatar(existing, row.avatar);
                existing.options.data = Object.assign({}, existing.options.data || {}, row);
                try { existing.setPopupContent(`<div style="position:relative;text-align:center;"><img src="${row.avatar || existing.options.data.avatar || 'ritualnet-logo.png'}"><b>@${row.name}</b><i>"${row.pledge}"</i></div>`); } catch(e){}
              } else {
                addSummoningToUI(row, false, { toTop:true });
              }
            } catch(e){ console.warn('postgres_changes handler error', e); }
          });

          ritualChannel.on('broadcast', { event: 'new_summon' }, payload => {
            try {
              if (!payload) return;
              const row = payload;
              const existing = findExistingMarker(row);
              if (existing) {
                if (row.avatar) updateMarkerAvatar(existing, row.avatar);
                existing.options.data = Object.assign({}, existing.options.data || {}, row);
              } else {
                addSummoningToUI(row, false, { toTop:true });
              }
            } catch(e){ console.warn('broadcast handler error', e); }
          });

          ritualChannel.subscribe(status => {
            console.log('[RITUALNET] realtime subscribe status:', status);
            const ok = status === 'SUBSCRIBED' || (status && status.status === 'SUBSCRIBED');
            if (ok) {
              realtimeConnected = true; ritualSubscribed = true;
              console.log('[RITUALNET] realtime SUBSCRIBED');
              heartbeat = setInterval(() => { try { ritualChannel.send({ type: 'broadcast', event: 'ping', payload: {} }).catch(()=>{}); } catch(e){} }, 10000);
              stopPolling();
            } else {
              realtimeConnected = false; ritualSubscribed = false;
              // if error/closed start polling
              if (status === 'ERROR' || status === 'CLOSED' || /UNAUTHORIZED/i.test(String(status))) {
                console.warn('[RITUALNET] realtime subscription not ready:', status);
                startPolling();
              }
            }
          });

          // if not subscribed soon, start polling fallback
          setTimeout(() => { if (!realtimeConnected && !pollingInterval) startPolling(); }, 1200);
        } catch(e) {
          console.error('[RITUALNET] connectRealtime error', e);
          startPolling();
        }
      }

      connectRealtime();
      window.addEventListener('online', connectRealtime);

      // broadcast helper: try main channel if ready, otherwise send via short-lived temp channel immediately
      async function sendBroadcastImmediate(payload) {
        try {
          if (ritualSubscribed && ritualChannel && typeof ritualChannel.send === 'function') {
            await ritualChannel.send({ type:'broadcast', event:'new_summon', payload }).catch(err => { throw err; });
            console.log('[RITUALNET] broadcast sent via main channel');
            return true;
          } else {
            // send immediately using temp channel (no waiting)
            const tempName = 'summonings-temp-' + Math.random().toString(36).slice(2);
            const tempCh = window.__supabase.channel(tempName, { config:{ broadcast:{ self:false } } });
            try {
              await tempCh.subscribe();
              await tempCh.send({ type:'broadcast', event:'new_summon', payload }).catch(err => { throw err; });
              console.log('[RITUALNET] broadcast sent via temp channel', tempName);
            } finally {
              try { window.__supabase.removeChannel(tempCh); } catch(_) {}
            }
            return true;
          }
        } catch (err) {
          console.warn('[RITUALNET] sendBroadcastImmediate failed, will retry shortly', err);
          // schedule a retry but don't block UI
          setTimeout(() => sendBroadcastImmediate(payload), 400);
          return false;
        }
      }

      // visibility handlers
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          loadAll();
          if (!realtimeConnected && !pollingInterval) startPolling();
        }
      });
      window.addEventListener('focus', () => loadAll());

      // UI interactions
      map.on('click', function(e) {
        clickedPos = e.latlng;
        const pulse = document.createElement('div');
        pulse.className = 'map-click-pulse';
        pulse.style.left = (e.containerPoint.x - 30) + 'px';
        pulse.style.top = (e.containerPoint.y - 30) + 'px';
        document.body.appendChild(pulse);
        setTimeout(() => pulse.remove(), 800);
        const modal = document.getElementById('ritualModal');
        modal.style.display = 'flex';
        document.getElementById('avatarPreview').src = 'ritualnet-logo.png';
        document.getElementById('username').value = '';
        document.getElementById('pledge').value = '';
        setTimeout(() => document.getElementById('username').focus(), 100);
      });

      document.getElementById('titleLink').onclick = () => window.open('https://x.com/ritualnet', '_blank');
      const closeModal = () => { document.getElementById('ritualModal').style.display = 'none'; clickedPos = null; };
      document.getElementById('closeBtn').onclick = closeModal;
      document.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) closeModal(); };
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

      document.querySelector('.upload-btn').onclick = () => document.getElementById('avatarInput').click();
      document.getElementById('avatarInput').onchange = e => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = ev => document.getElementById('avatarPreview').src = ev.target.result;
          reader.readAsDataURL(file);
        }
      };

      // Join -> insert -> local add -> immediate broadcast (tempCh fallback guaranteed)
      document.querySelector('.join-btn').onclick = async () => {
        const avatar = document.getElementById('avatarPreview').src;
        const name = document.getElementById('username').value.trim() || "ritualist";
        const pledge = document.getElementById('pledge').value.trim() || "I have joined.";
        if (!clickedPos) return;

        const newSummon = { name, pledge, avatar, lat: clickedPos.lat, lng: clickedPos.lng, timestamp: Date.now() };

        try {
          const { data, error } = await window.__supabase.from('summonings').insert(newSummon).select();
          if (error) { console.error('[RITUALNET] INSERT ERROR', error); alert('Failed to join.'); return; }

          closeModal();
          const success = document.getElementById('success');
          success.classList.add('active');
          setTimeout(() => { success.classList.remove('active'); map.flyTo(clickedPos, 10, { duration: 1.8 }); }, 900);

          const row = (data && data[0]) ? data[0] : { ...newSummon, id: `tmp-${Date.now()}` };
          addSummoningToUI(row, true, { toTop:true });

          // **Send broadcast immediately via main channel if possible,
          // otherwise send via temp channel RIGHT AWAY (no wait)**.
          sendBroadcastImmediate(row);

        } catch (err) {
          console.error('[RITUALNET] join error', err);
          alert('Unexpected error. Check console.');
        }
      };

      // reset
      document.getElementById('ritualLogo').onclick = () => {
        logoClicks++;
        if (clickTimer) clearTimeout(clickTimer);
        if (logoClicks === 7) { document.getElementById('resetConfirm').style.display = 'flex'; logoClicks = 0; }
        else { clickTimer = setTimeout(() => { logoClicks = 0; }, 3000); }
      };

      document.getElementById('confirmReset').onclick = async () => {
        try {
          await window.__supabase.from('summonings').delete().neq('timestamp', 0);
          localStorage.removeItem('ritualnet_summonings');
          loadAll();
          document.getElementById('resetConfirm').style.display = 'none';
        } catch(e){ console.error('[RITUALNET] reset error', e); alert('Reset failed — check console.'); }
      };
      document.getElementById('cancelReset').onclick = () => { document.getElementById('resetConfirm').style.display = 'none'; };

      // expose for debugging
      window.__ritual = { map, markers, loadAll, connectRealtime, sendBroadcastImmediate, findExistingMarker };
      console.log('[RITUALNET] initialized — aggressive instant broadcast + polling. Check console for realtime subscribe logs.');
    }); // end load
  </script>
</body>
</html>
