<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RitualNet Global Map</title>
    <style>
        /* Placeholder CSS for elements referenced in JS, adjust as needed */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
        .modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; 
            z-index: 1000;
        }
        .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 400px; }
        #ritualModal { display: none; } /* Initially hidden */
        #success { 
            position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); 
            background: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px; 
            opacity: 0; transition: all 0.5s ease; z-index: 1001;
        }
        #success.active { bottom: 20px; opacity: 1; }
        #ritualLogo { cursor: pointer; position: absolute; top: 10px; left: 10px; z-index: 500; }
        #resetConfirm { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 20px; border: 1px solid #ccc; z-index: 1002; 
            display: none; flex-direction: column; 
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="ritualLogo">🔮</div> 
    <div id="success">Ritual completed successfully!</div>

    <div id="ritualModal" class="modal">
        <div class="modal-content">
            <h3>Join the Ritual</h3>
            <span id="closeBtn" style="float: right; cursor: pointer;">&times;</span>
            
            <div style="text-align: center; margin-bottom: 15px;">
                <img id="avatarPreview" src="placeholder.png" alt="Avatar" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                <button class="upload-btn">Upload Avatar</button>
            </div>

            <label for="username">Username:</label>
            <input type="text" id="username" value="ritualist" maxlength="20">

            <label for="pledge">Pledge:</label>
            <textarea id="pledge" maxlength="100">I have joined.</textarea>

            <button class="join-btn" style="margin-top: 15px;">Submit Ritual</button>
        </div>
    </div>

    <div id="resetConfirm">
        <p>Are you sure you want to delete ALL local and global ritual data?</p>
        <div>
            <button id="confirmReset">Confirm Reset</button>
            <button id="cancelReset">Cancel</button>
        </div>
    </div>

    <script>
    // --- Global Variables ---
    let clickedPos = null;
    let logoClicks = 0;
    let clickTimer = null;
    let map; // Assume your map object is initialized here (e.g., using Leaflet)

    // Placeholder for map initialization (replace with your actual map setup)
    document.addEventListener('DOMContentLoaded', () => {
        // Initialize your map object here. Example for Leaflet:
        // map = L.map('map').setView([20.5937, 78.9629], 5);
        // L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // Placeholder: If you use a different map library (Google Maps, etc.), initialize it.
        map = {
            on: (event, handler) => { /* Mock map listener */ if (event === 'click') document.getElementById('map').onclick = handler; },
            flyTo: (pos, zoom, options) => { console.log(`Map flying to ${pos.lat}, ${pos.lng}`); },
            // Add other map methods you use (e.g., clearMarkers, addMarker)
            clearMarkers: () => { console.log('Markers cleared.'); },
            addMarker: (lat, lng, name, avatar) => { console.log(`Marker added for ${name} at ${lat}, ${lng}`); }
        };

        // Attach the click handler to the map placeholder
        map.on('click', e => {
            clickedPos = { lat: e.lat || e.clientY, lng: e.lng || e.clientX }; // Use e.latlng for Leaflet/Google Maps
            document.getElementById('ritualModal').style.display = 'flex';
        });

        // Initialize sync on startup
        syncMapData();
    });

    // --- Core Functions ---
    
    // Function to load and render all markers from Local Storage
    const loadAll = () => {
        const allSummons = JSON.parse(localStorage.getItem('ritualnet_summonings') || '[]');
        
        // 1. Clear existing markers (Replace with your map library's method)
        if (map && map.clearMarkers) map.clearMarkers(); 

        // 2. Add new markers
        allSummons.forEach(summon => {
            // Replace with your map library's marker creation logic
            if (map && map.addMarker) map.addMarker(summon.lat, summon.lng, summon.name, summon.avatar);
        });
    };

    // Function for closing the modal (UNCHANGED)
    const closeModal = () => {
        document.getElementById('ritualModal').style.display = 'none';
        clickedPos = null;
    };

    // --- NEW: Real-Time Polling Function ---
    const syncMapData = () => {
        // Use fetch to get ALL data from your backend API
        fetch('/api/ritual/all')
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch global data');
                return response.json();
            })
            .then(arr => {
                if (!Array.isArray(arr)) {
                    console.error("API did not return a valid array of summons.");
                    return;
                }
                // 1. Update the local storage cache with the global data
                localStorage.setItem('ritualnet_summonings', JSON.stringify(arr));
                
                // 2. Refresh the map markers
                loadAll(); 
            })
            .catch(error => {
                console.warn("Real-Time Sync Error (Polling):", error);
                // You might choose to stop polling or show an error state
            });
    };

    // Start Polling every 5 seconds (5000 milliseconds) to check for other users' updates
    // This replaces the Firebase listening logic.
    setInterval(syncMapData, 5000); 

    // --- Event Listeners (Mostly UNCHANGED) ---

    // Modal Close Listeners (UNCHANGED)
    document.getElementById('closeBtn').onclick = closeModal;
    document.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) closeModal(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // Avatar Upload Listeners (UNCHANGED)
    document.querySelector('.upload-btn').onclick = () => document.getElementById('avatarInput').click();
    document.getElementById('avatarInput').onchange = e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = ev => document.getElementById('avatarPreview').src = ev.target.result;
            reader.readAsDataURL(file);
        }
    };

    // Join Button (SUBMISSION) Logic - MODIFIED to use fetch API
    document.querySelector('.join-btn').onclick = () => {
        const avatar = document.getElementById('avatarPreview').src;
        const name = document.getElementById('username').value.trim() || "ritualist";
        const pledge = document.getElementById('pledge').value.trim() || "I have joined.";
        if (!clickedPos) return;

        const payload = { 
            name, pledge, avatar, 
            lat: clickedPos.lat, lng: clickedPos.lng, 
            timestamp: Date.now() 
        };

        // --- NEW API Submission Logic (Replaces Firebase save) ---
        fetch('/api/ritual/join', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (!response.ok) throw new Error('Server submission failed.');
            return response.json(); // Wait for server response
        })
        .then(data => {
            // After successful server save, force an immediate sync/update.
            syncMapData(); 
        })
        .catch(error => {
            console.error("Error submitting location:", error);
            alert("Submission failed. Check your server connection.");
        });
        // --- End New API Submission Logic ---

        closeModal();
        const success = document.getElementById('success');
        success.classList.add('active');
        setTimeout(() => {
            success.classList.remove('active');
            if (map && map.flyTo) map.flyTo(clickedPos, 10, { duration: 1.8 }); // Animation preserved
        }, 3200);
    };

    // Logo Click/Reset Logic (Firebase reference removed from reset)
    document.getElementById('ritualLogo').onclick = () => {
        logoClicks++;
        if (clickTimer) clearTimeout(clickTimer);
        if (logoClicks === 7) {
            document.getElementById('resetConfirm').style.display = 'flex';
            logoClicks = 0;
        } else {
            clickTimer = setTimeout(() => { logoClicks = 0; }, 3000);
        }
    };

    document.getElementById('confirmReset').onclick = () => {
        localStorage.removeItem('ritualnet_summonings');
        loadAll();
        
        // --- NOTE: You need a DELETE /api/ritual/all endpoint on your server
        // fetch('/api/ritual/all', { method: 'DELETE' }).catch(console.error);
        
        document.getElementById('resetConfirm').style.display = 'none';
    };

    document.getElementById('cancelReset').onclick = () => {
        document.getElementById('resetConfirm').style.display = 'none';
    };

    // --- The original Firebase GLOBAL REAL-TIME SYNC block has been fully replaced by the syncMapData function and setInterval call above. ---

    </script>
</body>
</html>
