<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RITUALNET</title>

  <!-- Leaflet CSS & JS (unchanged) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{margin:0;background:#000;overflow:hidden;height:100vh;font-family:'Rajdhani',sans-serif;color:#0f0;}
    #map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
    .leaflet-control-zoom, .leaflet-control-attribution{display:none!important;}
    /* title bar and styles unchanged */
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="title-bar">
    <div id="ritualLogo"><img src="ritualnet-logo.png" alt="ritual-logo"></div>
    <div class="title-text" id="titleLink">RITUALNET</div>
  </div>

  <div class="subtitle">Let’s Make The World Ritualize</div>

  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent"></div>
  </div>

  <div class="modal" id="ritualModal">
    <div class="card">
      <div class="close-btn" id="closeBtn">X</div>
      <h2>PERFORM THE RITUAL</h2>
      <div class="avatar-circle"><img src="ritualnet-logo.png" id="avatarPreview" alt="avatar"></div>
      <label class="upload-btn">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field input-field" id="pledge" placeholder="Speak your pledge..."></textarea>
      <button class="join-btn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <div class="success" id="success">
    <div class="ritual-circle"></div>
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <div id="resetConfirm">
    <div style="font-size:28px;margin-bottom:10px;">RESET THE CIRCLE?</div>
    <div style="display:flex;gap:20px;">
      <button id="confirmReset">BURN IT ALL</button>
      <button id="cancelReset">CANCEL</button>
    </div>
  </div>

  <div id="syncStatus">Sync: <span id="syncText">local</span></div>

  <!-- Supabase loader -->
  <script>
  (function(){
    const SUPABASE_URL = 'https://xgttfiqewnwpqguhbpgv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndHRmaXFld253cHFndWhicGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxOTY1ODgsImV4cCI6MjA3ODc3MjU4OH0.zVK46pTGH0_Ruu20s35ep8NnsQd2ROenG_EuWezXiWg';
    const UMD_SRC = 'https://unpkg.com/@supabase/supabase-js/dist/umd/supabase.js';

    function installShim(){
      window.__supabase = {
        push: async () => false,
        removeAll: async () => false,
        onValue: (cb) => () => {},
        status: { connected: false }
      };
      document.getElementById('syncText').textContent = 'local';
    }

    const s = document.createElement('script');
    s.src = UMD_SRC; s.async = true;
    s.onload = () => {
      try {
        const createClient = window.supabase?.createClient;
        const client = createClient(SUPABASE_URL, SUPABASE_KEY);
        const TABLE = 'summonings';
        async function push(item){ await client.from(TABLE).insert([item]); }
        async function removeAll(){ await client.from(TABLE).delete().neq('id',''); }
        function onValue(cb){
          client.from(TABLE).select('*').then(({data})=>cb({val:()=>data||[]}));
          const chan = client.channel('public:'+TABLE)
            .on('postgres_changes',{event:'*',schema:'public',table:TABLE},()=>{
              client.from(TABLE).select('*').then(({data})=>cb({val:()=>data||[]}));
            }).subscribe();
          return ()=>client.removeChannel(chan);
        }
        window.__supabase = {supabase:client,push,removeAll,onValue,status:{connected:true}};
        document.getElementById('syncText').textContent = 'connected';
      } catch(e){ installShim(); }
    };
    s.onerror = installShim;
    document.head.appendChild(s);
  })();
  </script>

  <!-- Polling fallback -->
  <script>
  (function(){
    const SUPABASE_URL = 'https://xgttfiqewnwpqguhbpgv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndHRmaXFld253cHFndWhicGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxOTY1ODgsImV4cCI6MjA3ODc3MjU4OH0.zVK46pTGH0_Ruu20s35ep8NnsQd2ROenG_EuWezXiWg';
    const STORAGE_KEY='ritualnet_summonings_v2';
    async function poll(){
      try{
        const res=await fetch(`${SUPABASE_URL}/rest/v1/summonings?select=*`,{
          headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
        });
        const data=await res.json();
        localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
        localStorage.setItem('ritualnet_summonings',JSON.stringify(data));
        if(typeof loadAll==='function')loadAll();
      }catch(e){}
    }
    setInterval(poll,5000); setTimeout(poll,1500);
  })();
  </script>

  <!-- Main logic -->
  <script>
    const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([10,0],2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png').addTo(map);
    const markers=L.layerGroup().addTo(map);const recent=document.getElementById('recent');
    function loadAll(){
      const data=JSON.parse(localStorage.getItem('ritualnet_summonings')||'[]');
      markers.clearLayers();recent.innerHTML='';
      data.slice(-10).reverse().forEach(s=>{
        const m=L.marker([s.lat,s.lng]).addTo(markers);
        m.bindPopup(`<b>@${s.name}</b><br>"${s.pledge}"`);
        const div=document.createElement('div');
        div.className='entry';
        div.innerHTML=`<div class="name">@${s.name}</div><div class="pledge">"${s.pledge}"</div>`;
        recent.appendChild(div);
      });
    }
    loadAll();
    map.on('click',e=>{
      clickedPos=e.latlng;
      document.getElementById('ritualModal').style.display='flex';
    });
    document.getElementById('closeBtn').onclick=()=>document.getElementById('ritualModal').style.display='none';
    document.querySelector('.join-btn').onclick=async()=>{
      const name=document.getElementById('username').value.trim()||'ritualist';
      const pledge=document.getElementById('pledge').value.trim()||'I have joined.';
      const avatar=document.getElementById('avatarPreview').src;
      const s={name,pledge,avatar,lat:clickedPos.lat,lng:clickedPos.lng,timestamp:Date.now()};
      const all=JSON.parse(localStorage.getItem('ritualnet_summonings')||'[]');all.push(s);
      localStorage.setItem('ritualnet_summonings',JSON.stringify(all));
      loadAll();
      if(window.__supabase)try{await window.__supabase.push(s);}catch(e){}
      document.getElementById('ritualModal').style.display='none';
      document.getElementById('success').classList.add('active');
      setTimeout(()=>document.getElementById('success').classList.remove('active'),3000);
    };
  </script>
</body>
</html>
