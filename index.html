<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ritualnet Map</title>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      margin: 0;
      background: #0a0a0f;
      font-family: 'Orbitron', sans-serif;
      color: #e0e0ff;
      overflow: hidden;
    }
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    
    /* Top bar */
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to bottom, rgba(20,0,40,0.9), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
      pointer-events: none;
    }
    .logo {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(90deg, #ff00aa, #aa00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px #ff00aa88;
    }
    .view-toggle {
      pointer-events: all;
      background: rgba(30,10,60,0.7);
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid #ff00aa44;
    }
    .view-toggle label {
      color: #fff;
      margin: 0 10px;
      cursor: pointer;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #330033;
      transition: .4s;
      border-radius: 34px;
      box-shadow: 0 0 15px #ff00aa55;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px; width: 20px;
      left: 3px; bottom: 3px;
      background: linear-gradient(#ff00aa, #aa00ff);
      transition: .4s;
      border-radius: 50%;
      box-shadow: 0 0 15px #ff00aa;
    }
    input:checked + .slider { background: #550055; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* Recent Notes Panel */
    .notes-panel {
      position: absolute;
      left: 20px;
      bottom: 100px;
      width: 320px;
      background: rgba(15,5,35,0.85);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #ff00aa33;
      box-shadow: 0 0 30px rgba(255,0,170,0.3);
      z-index: 10;
      animation: float 6s ease-in-out infinite;
    }
    .notes-title {
      font-size: 18px;
      margin-bottom: 12px;
      color: #ff99ee;
      text-shadow: 0 0 10px #ff00aa;
    }
    .note {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      animation: slideIn 0.6s ease-out forwards;
      opacity: 0;
      transform: translateX(-30px);
    }
    .note img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin-right: 10px;
      border: 2px solid #ff00aa;
      box-shadow: 0 0 15px #ff00aa88;
    }
    .note-text {
      font-size: 14px;
      color: #e0d0ff;
    }
    .note-user { color: #ff99ee; font-weight: bold; }

    /* Pin Button */
    .pin-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(45deg, #ff00aa, #aa00ff);
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px #ff00aa88;
      z-index: 10;
      animation: pulse 2s infinite;
      transition: all 0.3s;
    }
    .pin-btn:hover {
      transform: translateX(-50%) scale(1.1);
      box-shadow: 0 0 50px #ff00aa;
    }

    /* Animations */
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pulse { 0% { box-shadow: 0 0 30px #ff00aa88; } 50% { box-shadow: 0 0 50px #ff00aa; } 100% { box-shadow: 0 0 30px #ff00aa88; } }
    @keyframes slideIn { to { opacity:1; transform:translateX(0); } }

    /* Custom cluster style */
    .ritual-cluster {
      background: rgba(170,0,255,0.2) !important;
      border: 3px solid #ff00aa !important;
      box-shadow: 0 0 20px #ff00aa !important;
    }
    .ritual-cluster div {
      background: linear-gradient(45deg, #ff00aa, #aa00ff) !important;
      color: white !important;
      font-weight: bold !important;
    }

    /* Avatar glow */
    .ritual-avatar {
      filter: drop-shadow(0 0 10px #ff00aa) drop-shadow(0 0 20px #aa00ff);
      animation: avatarGlow 4s ease-in-out infinite alternate;
    }
    @keyframes avatarGlow { from { filter: drop-shadow(0 0 10px #ff00aa); } to { filter: drop-shadow(0 0 25px #ff00aa); } }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="header">
    <div class="logo">✦ RITUALNET</div>
    <div class="view-toggle">
      <label>Avatar View</label>
      <label class="switch">
        <input type="checkbox" id="viewMode">
        <span class="slider"></span>
      </label>
      <label>Cluster View</label>
    </div>
  </div>

  <div class="notes-panel">
    <div class="notes-title">Recent Rituals</div>
    <div class="note"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=fallenabdillah" alt=""><div><span class="note-user">@fallenabdillah</span><br>"Ritualnet basecamp Jakarta Selatan"</div></div>
    <div class="note"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=CyriptoMemo" alt=""><div><span class="note-user">@CyriptoMemo</span><br>"GM Ritual frens 🧿"</div></div>
    <div class="note"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=evemeowy" alt=""><div><span class="note-user">@evemeowy</span><br>"summoning the chain spirits tonight"</div></div>
  </div>

  <button class="pin-btn">✦ Summon on Map ✦</button>

  <script>
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([-2.5, 117], 3);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{retina}.png', {
      maxZoom: 19
    }).addTo(map);

    const avatars = L.layerGroup().addTo(map);
    const clusters = new L.MarkerClusterGroup({
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      iconCreateFunction: function(cluster) {
        return L.divIcon({
          html: `<div><span>${cluster.getChildCount()}</span></div>`,
          className: 'ritual-cluster',
          iconSize: L.point(50, 50)
        });
      }
    }).addTo(map);

    // Sample Ritualnet community pins (add as many as you want)
    const ritualPins = [
      {lat: -6.2088, lng: 106.8456, user: "fallenabdillah", msg: "Jakarta Ritual Hub", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=fallenabdillah"},
      {lat: 37.7749, lng: -122.4194, user: "CryptoWitch", msg: "SF Summoning Circle", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=CryptoWitch"},
      {lat: 51.5074, lng: -0.1278, user: "ChainPriest", msg: "London Node Active", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=ChainPriest"},
      {lat: 1.3521, lng: 103.8198, user: "SG_Ritualist", msg: "Singapore Gateway", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=SG_Ritualist"},
      {lat: -6.9147, lng: 107.6098, user: "BandungMage", msg: "Bandung Basecamp", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=BandungMage"},
      // Add 100+ more if you want real density
    ];

    ritualPins.forEach((pin, i) => {
      const icon = L.divIcon({
        className: 'ritual-avatar',
        html: `<img src="${pin.avatar}" style="width:50px;height:50px;border-radius:50%;border:3px solid #ff00aa;">`,
        iconSize: [50,50],
        iconAnchor: [25,50]
      });

      const marker = L.marker([pin.lat, pin.lng], { icon: icon });
      marker.bindPopup(`<b>@${pin.user}</b><br>${pin.msg}`);
      
      avatars.addLayer(marker);
      clusters.addLayer(marker);
    });

    // Toggle between avatar & cluster view
    document.getElementById('viewMode').addEventListener('change', function(e) {
      if (this.checked) {
        map.removeLayer(avatars);
        map.addLayer(clusters);
      } else {
        map.removeLayer(clusters);
        map.addLayer(avatars);
      }
    });

    // Pin button (you can connect this to a backend later)
    document.querySelector('.pin-btn').addEventListener('click', () => {
      alert('✦ Summoning ritual in progress... ✦');
    });
  </script>
</body>
</html>
