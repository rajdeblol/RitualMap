<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RitualNet</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #leftPanel {
      width: 380px;
      min-width: 380px;
      max-width: 380px;
      background: #000;
      border-right: 2px solid #222;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #map {
      flex: 1;
      background: #222;
    }

    #recent {
      flex: 1;
      overflow-y: auto;
    }

    .summoningItem {
      border-bottom: 1px solid #333;
      padding: 14px;
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .summoningItem:hover {
      background: #1a1a1a;
    }

    .summoningAvatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #333;
      object-fit: cover;
    }

    .summoningInfo {
      flex: 1;
    }

    .summoningName {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .summoningPledge {
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>
<div id="app">
  <div id="leftPanel">
    <h2 style="padding: 16px; margin: 0; border-bottom: 1px solid #333;">
      Rituals
    </h2>
    <div id="recent"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* --------------------------------------------------------------------
   INITIALIZATION
-------------------------------------------------------------------- */
const recent = document.getElementById("recent");

const map = L.map("map").setView([0, 0], 2);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19
}).addTo(map);

const markers = L.layerGroup().addTo(map);

const SUPABASE_URL = "https://wdysgrptfirjbgahjdiy.supabase.co";
const SUPABASE_KEY = `<SECRET>`;
window.__supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* --------------------------------------------------------------------
   UI BUILDER: YOU SAID DON'T CHANGE ANYTHING → EXACT SAME
-------------------------------------------------------------------- */
function addSummoningToUI(s, animate = false, opts = { toTop: true }) {
  const item = document.createElement("div");
  item.className = "summoningItem";
  item.dataset.id = s.id;

  item.innerHTML = `
    <img class="summoningAvatar" src="${s.avatar || ""}">
    <div class="summoningInfo">
      <div class="summoningName">${s.name}</div>
      <div class="summoningPledge">${s.pledge || ""}</div>
    </div>
  `;

  item.onclick = () =>
    map.setView([s.lat, s.lng], 14, { animate: true });

  if (opts.toTop) recent.prepend(item);
  else recent.append(item);

  L.marker([s.lat, s.lng])
    .addTo(markers)
    .bindPopup(`<b>${s.name}</b><br>${s.pledge || ""}`);
}

/* --------------------------------------------------------------------
   🔥 OPTIMIZED LOADALL — SAME LOGIC, JUST FASTER
-------------------------------------------------------------------- */
async function loadAll() {
  try {
    // 1) FAST — load cached data instantly
    const cached = localStorage.getItem("ritualnet_summonings");
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed) && parsed.length) {
          markers.clearLayers();
          recent.innerHTML = "";
          parsed.forEach(s => addSummoningToUI(s, false, { toTop: false }));
        }
      } catch (err) {}
    }

    // 2) FAST — lightweight Supabase query
    const { data, error } = await window.__supabase
      .from("summonings")
      .select("id,name,lat,lng,avatar,pledge,timestamp")
      .order("timestamp", { ascending: false })
      .limit(50);

    if (error || !data) return;

    // 3) FAST — update cache
    try {
      localStorage.setItem("ritualnet_summonings", JSON.stringify(data));
    } catch (e) {}

    // 4) FAST — don't re-render if nothing changed
    const oldIds = Array.from(recent.children).map(e => e.dataset.id);
    const newIds = data.map(d => d.id);

    const changed =
      oldIds.length !== newIds.length ||
      newIds.some(id => !oldIds.includes(id));

    if (!changed) return;

    // 5) Re-render fresh list (same behavior as original)
    markers.clearLayers();
    recent.innerHTML = "";

    data.forEach(s => addSummoningToUI(s, false, { toTop: false }));

    setTimeout(() => map.invalidateSize(), 120);
  } catch (err) {
    console.warn("loadAll error", err);
  }
}

/* --------------------------------------------------------------------
   LOAD ON START
-------------------------------------------------------------------- */
loadAll();

/* --------------------------------------------------------------------
   REALTIME (UNCHANGED)
-------------------------------------------------------------------- */
window.__supabase
  .channel("new_summon_channel")
  .on(
    "broadcast",
    { event: "new_summon" },
    payload => {
      const s = payload.payload;
      addSummoningToUI(s, true, { toTop: true });
      map.setView([s.lat, s.lng], 13, { animate: true });

      const cached = localStorage.getItem("ritualnet_summonings");
      let arr = [];
      try { arr = JSON.parse(cached) || []; } catch (e) {}
      arr.unshift(s);
      arr = arr.slice(0, 50);
      localStorage.setItem("ritualnet_summonings", JSON.stringify(arr));
    }
  )
  .subscribe();

/* Live DB changes (unchanged, as you requested) */
window.__supabase
  .channel("realtime_summonings")
  .on(
    "postgres_changes",
    { event: "*", schema: "public", table: "summonings" },
    () => {
      loadAll();
    }
  )
  .subscribe();
</script>

</body>
</html>
