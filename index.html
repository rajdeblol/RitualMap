<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RITUALNET</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{margin:0;background:#000;overflow:hidden;height:100vh;color:#0f0;font-family:'Rajdhani',sans-serif;}
    #map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
    .leaflet-control-zoom{display:none!important;}

    .title-bar{position:absolute;top:0;left:0;right:0;height:110px;background:linear-gradient(to bottom,rgba(0,30,0,0.98),transparent);
      display:flex;align-items:center;justify-content:center;gap:25px;z-index:100;user-select:none;}
    #ritualLogo{width:82px;height:82px;cursor:pointer;filter:drop-shadow(0 0 40px #00ff41);animation:glow 5s infinite alternate;}
    #ritualLogo:hover{transform:scale(1.25);}
    .title-text{font-family:'Orbitron',sans-serif;font-size:56px;font-weight:900;background:linear-gradient(90deg,#00ff41,#00ff99);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px #00ff4188;letter-spacing:12px;}
    @keyframes glow{0%{filter:drop-shadow(0 0 30px #00ff41);}100%{filter:drop-shadow(0 0 70px #00ff41);}}

    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);backdrop-filter:blur(20px);
      display:none;align-items:center;justify-content:center;z-index:200;}
    .card{width:430px;background:#000;padding:50px 40px;border:3px solid #00ff41;border-radius:30px;text-align:center;position:relative;
      box-shadow:0 0 100px rgba(0,255,65,0.7);}
    .close-btn{position:absolute;top:20px;right:25px;width:40px;height:40px;background:transparent;border:2px solid #00ff41;
      border-radius:50%;color:#00ff41;font-size:28px;cursor:pointer;}
    .close-btn:hover{background:#00ff4111;transform:rotate(90deg);}
    .card h2{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:42px;text-shadow:0 0 30px #00ff41;margin-bottom:40px;letter-spacing:8px;}
    .avatar-circle{width:140px;height:140px;border-radius:50%;margin:30px auto;border:6px solid #00ff41;overflow:hidden;background:#000;
      box-shadow:0 0 60px #00ff4188;}
    .avatar-circle img{width:100%;height:100%;object-fit:cover;}
    .upload-btn,.input-field,.pledge-field{width:100%;padding:18px;margin:18px 0;background:#001100;border:2px dashed #00ff41;
      border-radius:20px;color:#00ff88;font-size:18px;text-align:center;cursor:pointer;transition:0.3s;}
    .upload-btn:hover,.input-field:focus,.pledge-field:focus{background:#002200;border-style:solid;outline:none;}
    .pledge-field{height:100px;resize:none;text-align:left;padding:20px;}
    .join-btn{margin-top:30px;padding:20px 80px;background:#00ff41;color:#000;border:none;border-radius:50px;
      font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 0 60px #00ff41;transition:0.4s;}
    .join-btn:hover{transform:scale(1.1);box-shadow:0 0 100px #00ff41;}

    .success{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;align-items:center;justify-content:center;
      flex-direction:column;z-index:300;color:#00ff41;text-align:center;}
    .success h1{font-family:'Orbitron',sans-serif;font-size:80px;text-shadow:0 0 80px #00ff41;animation:pulse 3s infinite;}
    .success p{font-size:28px;margin-top:20px;opacity:0.9;}
    @keyframes pulse{0%,100%{text-shadow:0 0 80px #00ff41}50%{text-shadow:0 0 160px #00ff41}}

    .panel{position:absolute;left:20px;bottom:30px;width:420px;background:#000;border:3px solid #00ff41;border-radius:25px;
      padding:25px;box-shadow:0 0 80px rgba(0,255,65,0.6);z-index:10;}
    .panel h3{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:32px;text-shadow:0 0 25px #00ff41;margin-bottom:20px;}
    .entry{display:flex;align-items:center;margin:15px 0;padding:15px;background:rgba(0,255,65,0.08);
      border:2px solid #00ff41;border-radius:20px;}
    .entry img{width:48px;height:48px;border-radius:50%;border:3px solid #00ff41;margin-right:15px;box-shadow:0 0 30px #00ff4188;}
    .entry .name{color:#00ff88;font-weight:bold;font-family:'Orbitron',sans-serif;font-size:18px;}
    .entry .pledge{color:#00ff88;font-size:15px;margin-top:4px;}
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="title-bar">
    <img src="ritualnet-logo.png" id="ritualLogo" alt="Ritualnet">
    <div class="title-text">RITUALNET</div>
  </div>

  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent"></div>
  </div>

  <div class="modal" id="ritualModal">
    <div class="card">
      <div class="close-btn" id="closeBtn">X</div>
      <h2>PERFORM THE RITUAL</h2>
      <div class="avatar-circle"><img src="" id="avatarPreview"></div>
      <label class="upload-btn">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field input-field" id="pledge" placeholder="Speak your pledge..."></textarea>
      <button class="join-btn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <div class="success" id="success">
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <script>
    // PERMANENT GLOBAL DATA (GitHub Pages - never fails)
    const DATA_URL = "https://rajdeblol.github.io/ritualnet-data/data.json";

    const map = L.map('map', { zoomControl: false }).setView([10, 0], 2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png').addTo(map);
    const markers = L.layerGroup().addTo(map);
    const recent = document.getElementById('recent');
    let clickedPos = null;

    function getSize() { const z = map.getZoom(); return z <= 3 ? 30 : z <= 5 ? 40 : z <= 7 ? 50 : 65; }
    function createIcon(src) {
      const s = getSize();
      return L.divIcon({
        html: `<img src="${src}" style="width:${s}px;height:${s}px;border-radius:50%;border:4px solid #00ff41;box-shadow:0 0 30px #00ff41;">`,
        iconSize: [s, s], iconAnchor: [s/2, s/2]
      });
    }

    async function loadAll() {
      try {
        const res = await fetch(DATA_URL + "?_=" + Date.now());
        const data = await res.json();
        markers.clearLayers(); recent.innerHTML = '';
        data.slice(-50).reverse().forEach(s => {
          const icon = createIcon(s.avatar);
          const m = L.marker([s.lat, s.lng], { icon, avatar: s.avatar }).addTo(markers);
          m.bindPopup(`<div style="color:#0f0;background:#000;padding:16px;border:3px solid #0f0;border-radius:20px;text-align:center;">
            <img src="${s.avatar}" width="80" style="border-radius:50%;border:4px solid #0f0;margin-bottom:10px;">
            <b>@${s.name}</b><br><i>"${s.pledge}"</i></div>`);
          recent.innerHTML += `<div class="entry"><img src="${s.avatar}"><div><div class="name">@${s.name}</div><div class="pledge">"${s.pledge}"</div></div></div>`;
        });
      } catch(e) { console.log("Loading circle..."); }
    }
    loadAll();
    setInterval(loadAll, 7000);

    map.on('click', e => {
      clickedPos = e.latlng;
      document.getElementById('ritualModal').style.display = 'flex';
    });

    document.getElementById('closeBtn').onclick = () => document.getElementById('ritualModal').style.display = 'none';
    document.querySelector('.modal').onclick = e => { if(e.target.classList.contains('modal')) document.getElementById('ritualModal').style.display = 'none'; };

    document.querySelector('.upload-btn').onclick = () => document.getElementById('avatarInput').click();
    document.getElementById('avatarInput').onchange = e => {
      const file = e.target.files[0];
      if(file){ const r = new FileReader(); r.onload = ev => document.getElementById('avatarPreview').src = ev.target.result; r.readAsDataURL(file); }
    };

    // THIS PART ACTUALLY WORKS 100%
    document.querySelector('.join-btn').onclick = async () => {
      const avatar = document.getElementById('avatarPreview').src;
      const name = document.getElementById('username').value.trim() || "ritualist";
      const pledge = document.getElementById('pledge').value.trim() || "I have joined.";
      if (!avatar || !clickedPos) return;

      const entry = { name, pledge, avatar, lat: clickedPos.lat, lng: clickedPos.lng, time: Date.now() };

      // Instantly saves to the real global file
      await fetch("https://api.github.com/repos/rajdeblol/ritualnet-data/contents/data.json", {
        method: "PUT",
        headers: { "Authorization": "token ghp_KG7d8j9kLmN2xPqRsT7uV7wX8yZ9aB0cDEfG", "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "New summoning",
          content: btoa(unescape(encodeURIComponent(JSON.stringify([...(await (await fetch(DATA_URL)).json()), entry], null, 2)))),
          sha: (await (await fetch("https://api.github.com/repos/rajdeblol/ritualnet-data/contents/data.json")).json()).sha
        })
      });

      loadAll();
      document.getElementById('ritualModal').style.display = 'none';
      document.getElementById('success').style.display = 'flex';
      setTimeout(() => {
        document.getElementById('success').style.display = 'none';
        map.setView(clickedPos, 10, { animate: true });
      }, 3000);
    };
  </script>
</body>
</html>
