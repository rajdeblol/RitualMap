<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RITUALNET</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsSQ-i34f0BErk3qwNMK4QET07FbCvjWk",
      authDomain: "ritual-65fc5.firebaseapp.com",
      databaseURL: "https://ritual-65fc5-default-rtdb.firebaseio.com",
      projectId: "ritual-65fc5",
      storageBucket: "ritual-65fc5.firebasestorage.app",
      messagingSenderId: "249645412824",
      appId: "1:249645412824:web:159f0919dd0c4c18fc02ad",
      measurementId: "G-CY8WZEF0P1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const summoningsRef = ref(db, 'ritualnet/summonings');

    window.__firebase = { onValue, push, remove, summoningsRef };
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{margin:0;background:#000;overflow:hidden;height:100vh;font-family:'Rajdhani',sans-serif;color:#0f0;}
    #map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
    .leaflet-control-zoom, .leaflet-control-attribution{display:none!important;}

    .title-bar{
      position:absolute;top:0;left:0;right:0;height:110px;
      background:linear-gradient(to bottom,rgba(0,30,0,0.98),transparent);
      display:flex;align-items:center;justify-content:center;gap:25px;z-index:100;user-select:none;
    }
    #ritualLogo{
      width:82px;height:82px;cursor:pointer;
      filter:drop-shadow(0 0 40px #00ff41);
      animation:glow 5s infinite alternate;
      transition:0.3s;
    }
    #ritualLogo:hover{transform:scale(1.25);}
    .title-text{
      font-family:'Orbitron',sans-serif;font-size:56px;font-weight:900;
      background:linear-gradient(90deg,#00ff41,#00ff99);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      text-shadow:0 0 60px #00ff4188;letter-spacing:12px;cursor:pointer;
    }
    .subtitle{
      position:absolute;bottom:15px;left:50%;transform:translateX(-50%);
      font-size:16px;letter-spacing:2px;color:#00ff88;text-shadow:0 0 20px #00ff41;
    }
    @keyframes glow{0%{filter:drop-shadow(0 0 30px #00ff41);}100%{filter:drop-shadow(0 0 70px #00ff41);}}

    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);backdrop-filter:blur(20px);
      display:none;align-items:center;justify-content:center;z-index:200;}
    .card{width:430px;background:#000;padding:50px 40px;border:3px solid #00ff41;border-radius:30px;
      text-align:center;position:relative;box-shadow:0 0 100px rgba(0,255,65,0.7);}
    .close-btn{position:absolute;top:20px;right:25px;width:40px;height:40px;background:transparent;
      border:2px solid #00ff41;border-radius:50%;color:#00ff41;font-size:28px;cursor:pointer;}
    .close-btn:hover{background:#00ff4111;transform:rotate(90deg);}
    .card h2{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:42px;text-shadow:0 0 30px #00ff41;margin-bottom:40px;letter-spacing:8px;}
    .avatar-circle{width:140px;height:140px;border-radius:50%;margin:30px auto;border:6px solid #00ff41;overflow:hidden;background:#000;
      box-shadow:0 0 60px #00ff4188;}
    .avatar-circle img{width:100%;height:100%;object-fit:cover;}
    .upload-btn,.input-field,.pledge-field{width:100%;padding:18px;margin:18px 0;background:#001100;
      border:2px dashed #00ff41;border-radius:20px;color:#00ff88;font-size:18px;text-align:center;cursor:pointer;transition:0.3s;}
    .upload-btn:hover,.input-field:focus,.pledge-field:focus{background:#002200;border-style:solid;outline:none;}
    .pledge-field{height:100px;resize:none;text-align:left;padding:20px;}
    .join-btn{margin-top:30px;padding:20px 80px;background:#00ff41;color:#000;border:none;border-radius:50px;
      font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 0 60px #00ff41;transition:0.4s;}
    .join-btn:hover{transform:scale(1.1);box-shadow:0 0 100px #00ff41;}

    .success{
      position:fixed;top:0;left:0;width:100%;height:100%;background:#000;
      display:none;align-items:center;justify-content:center;flex-direction:column;
      z-index:300;color:#00ff41;text-align:center;opacity:0;
      transition:opacity 0.6s ease;
    }
    .success.active{ display:flex; opacity:1; }

    .success h1{
      font-family:'Orbitron',sans-serif;font-size:64px;text-shadow:0 0 60px #00ff41;
      animation:ritualPulse 2s ease-out;z-index:2;
    }
    .success p{
      margin-top:20px;font-size:20px;opacity:0;animation:fadeIn 1s ease 0.5s forwards;
    }
    .ritual-circle{
      position:absolute;width:300px;height:300px;border:3px solid #00ff41;
      border-radius:50%;box-shadow:0 0 80px #00ff41, inset 0 0 60px #00ff41;
      animation:expandGlow 2.5s ease-out forwards;opacity:0;z-index:1;
    }
    @keyframes ritualPulse{
      0%{text-shadow:0 0 60px #00ff41;transform:scale(1);}
      50%{text-shadow:0 0 120px #00ff41;transform:scale(1.05);}
      100%{text-shadow:0 0 60px #00ff41;transform:scale(1);}
    }
    @keyframes expandGlow{
      0%{width:0;height:0;opacity:1;}
      70%{width:400px;height:400px;opacity:0.6;}
      100%{width:500px;height:500px;opacity:0;}
    }
    @keyframes fadeIn{to{opacity:0.8;}}

    .panel{position:absolute;left:20px;bottom:30px;width:420px;background:#000;border:3px solid #00ff41;border-radius:25px;
      padding:25px;box-shadow:0 0 80px rgba(0,255,65,0.6);z-index:10;}
    .panel h3{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:32px;text-shadow:0 0 25px #00ff41;margin-bottom:20px;}
    .entry{display:flex;align-items:center;margin:15px 0;padding:15px;background:rgba(0,255,65,0.08);
      border:2px solid #00ff41;border-radius:20px;}
    .entry img{width:48px;height:48px;border-radius:50%;border:3px solid #00ff41;margin-right:15px;box-shadow:0 0 30px #00ff4188;}
    .entry .name{color:#00ff88;font-weight:bold;font-family:'Orbitron',sans-serif;font-size:18px;}
    .entry .pledge{color:#00ff88;font-size:15px;margin-top:4px;}

    .ritual-marker img{border-radius:50%;border:4px solid #00ff41;box-shadow:0 0 30px #00ff41;}
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- TITLE BAR – LOGO + RITUALNET + SUBTITLE -->
  <div class="title-bar">
    <img src="ritualnet-logo.png" id="ritualLogo" alt="Ritualnet">
    <div class="title-text" id="titleLink">RITUALNET</div>
  </div>
  <div class="subtitle">Let’s ritualize the world</div>

  <!-- PANEL -->
  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent"></div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="ritualModal">
    <div class="card">
      <div class="close-btn" id="closeBtn">X</div>
      <h2>PERFORM THE RITUAL</h2>
      <div class="avatar-circle"><img src="" id="avatarPreview"></div>
      <label class="upload-btn">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field input-field" id="pledge" placeholder="Speak your pledge..."></textarea>
      <button class="join-btn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <!-- SUCCESS -->
  <div class="success" id="success">
    <div class="ritual-circle"></div>
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <!-- RESET CONFIRM -->
  <div class="success" id="resetConfirm" style="display:none;font-size:40px;">
    <div>RESET THE CIRCLE?</div>
    <button class="join-btn" id="confirmReset" style="margin:30px 20px 0;font-size:28px;padding:18px 60px;">BURN IT ALL</button>
    <button class="join-btn" id="cancelReset" style="background:#333;">CANCEL</button>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([10, 0], 2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const markers = L.layerGroup().addTo(map);
    const recent = document.getElementById('recent');
    let clickedPos = null;
    let logoClicks = 0;

    const ritualLogo = new Image();
    ritualLogo.src = 'ritualnet-logo.png';

    function getSize() {
      const z = map.getZoom();
      if (z <= 3) return 30;
      if (z <= 5) return 40;
      if (z <= 7) return 50;
      return 65;
    }

    function createIcon(src) {
      const s = getSize();
      return L.divIcon({
        className: 'ritual-marker',
        html: `<img src="${src}" style="width:${s}px;height:${s}px;">`,
        iconSize: [s, s],
        iconAnchor: [s/2, s/2]
      });
    }

    map.on('zoomend', () => markers.eachLayer(m => m.setIcon(createIcon(m.options.data?.avatar || 'ritualnet-logo.png'))));

    // FADED RITUAL LOGO BEHIND AVATAR IN POPUP
    function compositeAvatar(userAvatarUrl, callback) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 80; canvas.height = 80;

      const logoImg = new Image();
      logoImg.crossOrigin = 'anonymous';
      logoImg.src = 'ritualnet-logo.png';

      const userImg = new Image();
      userImg.crossOrigin = 'anonymous';
      userImg.src = userAvatarUrl || 'ritualnet-logo.png';

      Promise.all([
        new Promise(r => { logoImg.onload = r; logoImg.onerror = () => r(); }),
        new Promise(r => { userImg.onload = r; userImg.onerror = () => r(); })
      ]).then(() => {
        // Faint logo behind
        ctx.globalAlpha = 0.25;
        ctx.drawImage(logoImg, 0, 0, 80, 80);
        ctx.globalAlpha = 1.0;

        // User avatar on top
        ctx.save();
        ctx.beginPath();
        ctx.arc(40, 40, 36, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(userImg, 0, 0, 80, 80);
        ctx.restore();

        // Green border
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(40, 40, 38, 0, Math.PI * 2);
        ctx.stroke();

        callback(canvas.toDataURL());
      });
    }

    function loadAll() {
      const summonings = JSON.parse(localStorage.getItem('ritualnet_summonings') || '[]');
      markers.clearLayers(); recent.innerHTML = '';
      summonings.slice(-10).reverse().forEach(s => {
        const icon = createIcon(s.avatar || 'ritualnet-logo.png');
        const m = L.marker([s.lat, s.lng], { icon, data: s }).addTo(markers);

        compositeAvatar(s.avatar, (compositeUrl) => {
          m.bindPopup(`
            <div style="color:#0f0;background:#000;padding:16px;border:3px solid #0f0;border-radius:20px;text-align:center;">
              <img src="${compositeUrl}" width="80" style="border-radius:50%;border:4px solid #0f0;margin-bottom:10px;">
              <b style="color:#00ff41;">@${s.name}</b><br>
              <i>"${s.pledge}"</i>
            </div>
          `);
        });

        recent.innerHTML += `<div class="entry"><img src="${s.avatar || 'ritualnet-logo.png'}"><div><div class="name">@${s.name}</div><div class="pledge">"${s.pledge}"</div></div></div>`;
      });
    }
    loadAll();

    // RITUALNET → X.COM
    document.getElementById('titleLink').onclick = () => {
      window.open('https://x.com/ritualnet', '_blank');
    };

    // MAP CLICK
    map.on('click', e => {
      clickedPos = e.latlng;
      document.getElementById('ritualModal').style.display = 'flex';
      document.getElementById('avatarPreview').src = '';
      document.getElementById('username').value = '';
      document.getElementById('pledge').value = '';
    });

    const closeModal = () => { document.getElementById('ritualModal').style.display = 'none'; clickedPos = null; };
    document.getElementById('closeBtn').onclick = closeModal;
    document.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) closeModal(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.querySelector('.upload-btn').onclick = () => document.getElementById('avatarInput').click();
    document.getElementById('avatarInput').onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => document.getElementById('avatarPreview').src = ev.target.result;
        reader.readAsDataURL(file);
      }
    };

    // JOIN + SUCCESS
    document.querySelector('.join-btn').onclick = () => {
      const avatar = document.getElementById('avatarPreview').src;
      const name = document.getElementById('username').value.trim() || "ritualist";
      const pledge = document.getElementById('pledge').value.trim() || "I have joined.";
      if (!avatar || !clickedPos) return;

      const newSummon = { name, pledge, avatar, lat: clickedPos.lat, lng: clickedPos.lng, timestamp: Date.now() };

      const all = JSON.parse(localStorage.getItem('ritualnet_summonings') || '[]');
      all.push(newSummon);
      localStorage.setItem('ritualnet_summonings', JSON.stringify(all));
      loadAll();

      if (window.__firebase) {
        window.__firebase.push(window.__firebase.summoningsRef, newSummon);
      }

      closeModal();
      const success = document.getElementById('success');
      success.classList.add('active');
      setTimeout(() => {
        success.classList.remove('active');
        map.flyTo(clickedPos, 10, { duration: 1.8 });
      }, 3200);
    };

    // 7-CLICK LOGO → BURN IT ALL
    document.getElementById('ritualLogo').onclick = () => {
      logoClicks++;
      if (logoClicks === 7) {
        document.getElementById('resetConfirm').style.display = 'flex';
        logoClicks = 0;
      }
      setTimeout(() => { if (logoClicks < 7) logoClicks = 0; }, 3000);
    };
    document.getElementById('confirmReset').onclick = () => {
      localStorage.removeItem('ritualnet_summonings');
      loadAll();
      if (window.__firebase) {
        window.__firebase.remove(window.__firebase.summoningsRef);
      }
      document.getElementById('resetConfirm').style.display = 'none';
    };
    document.getElementById('cancelReset').onclick = () => {
      document.getElementById('resetConfirm').style.display = 'none';
    };

    // FIREBASE SYNC
    if (window.__firebase) {
      const { onValue, summoningsRef } = window.__firebase;
      onValue(summoningsRef, (snap) => {
        const data = snap.val();
        const arr = data ? Object.keys(data).map(k => data[k]) : [];
        localStorage.setItem('ritualnet_summonings', JSON.stringify(arr));
        loadAll();
      });
    }
  </script>

</body>
</html>
