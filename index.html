<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RITUALNET</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');

    /* root + mobile-safe */
    html, body {
      margin: 0;
      padding: 0;
      height: -webkit-fill-available;
      height: 100vh;
      background: #000 !important;
      font-family: 'Rajdhani', sans-serif;
      color: #0f0;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overscroll-behavior-y: none;
    }
    * { box-sizing: border-box; }

    /* MAP full cover */
    #map {
      position: absolute;
      inset: 0; /* top:0; left:0; right:0; bottom:0; */
      z-index: 1;
    }
    .leaflet-control-zoom, .leaflet-control-attribution{display:none!important;}

    /* TITLE BAR */
    .title-bar{
      position:absolute;top:0;left:0;right:0;height:110px;
      background:linear-gradient(to bottom,rgba(0,30,0,0.98),transparent);
      display:flex;align-items:center;justify-content:center;gap:25px;z-index:100;user-select:none;
      padding-top: env(safe-area-inset-top);
      pointer-events:auto;
    }
    #ritualLogo{width:82px;height:82px;cursor:pointer;filter:drop-shadow(0 0 40px #00ff41);animation:glow 5s infinite alternate;transition:0.3s;position:relative;}
    #ritualLogo img{width:100%;height:100%;position:absolute;top:0;left:0;z-index:2;}
    #ritualLogo::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68%;height:68%;background:url('ritualnet-logo.png') center/contain no-repeat;opacity:0.18;z-index:-1;pointer-events:none;animation:ritualPulse 6s infinite ease-in-out;}
    #ritualLogo:hover{transform:scale(1.25);}

    .title-text{font-family:'Orbitron',sans-serif;font-size:56px;font-weight:900;background:linear-gradient(90deg,#00ff41,#00ff99);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px #00ff4188;letter-spacing:12px;cursor:pointer;position:relative;}
    .subtitle{position:absolute;top:100px;left:50%;transform:translateX(-50%);font-size:16px;letter-spacing:2px;color:#00ff88;text-shadow:0 0 20px #00ff41;font-family:'Orbitron',sans-serif;white-space:nowrap;z-index:100;}

    @keyframes glow{0%{filter:drop-shadow(0 0 30px #00ff41);}100%{filter:drop-shadow(0 0 70px #00ff41);}}
    @keyframes ritualPulse{0%,100%{opacity:0.15;transform:translate(-50%,-50%) scale(1);}50%{opacity:0.25;transform:translate(-50%,-50%) scale(1.08);}}

    /* MODAL */
    .modal{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(0,0,0,0.98);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;overflow-y:auto;-webkit-overflow-scrolling: touch;padding-bottom: env(safe-area-inset-bottom);}
    .card{width:430px;max-width:95vw;background:#000;padding:50px 40px;border:3px solid #00ff41;border-radius:30px;text-align:center;position:relative;box-shadow:0 0 100px rgba(0,255,65,0.7);}
    .close-btn{position:absolute;top:20px;right:25px;width:40px;height:40px;background:transparent;border:2px solid #00ff41;border-radius:50%;color:#00ff41;font-size:28px;cursor:pointer;}
    .close-btn:hover{background:#00ff4111;transform:rotate(90deg);}
    .card h2{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:42px;text-shadow:0 0 30px #00ff41;margin-bottom:40px;letter-spacing:8px;}

    .avatar-circle{width:140px;height:140px;border-radius:50%;margin:30px auto;border:6px solid #00ff41;overflow:hidden;background:#000;box-shadow:0 0 60px #00ff4188;position:relative;}
    .avatar-circle img{width:100%;height:100%;object-fit:cover;position:relative;z-index:2;}
    .avatar-circle::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68%;height:68%;background:url('ritualnet-logo.png') center/contain no-repeat;opacity:0.18;z-index:1;pointer-events:none;animation:ritualPulse 6s infinite ease-in-out;}

    .upload-btn,.input-field,.pledge-field{width:100%;padding:18px;margin:18px 0;background:#001100;border:2px dashed #00ff41;border-radius:20px;color:#00ff88;font-size:18px;text-align:center;cursor:pointer;transition:0.3s;}
    .upload-btn:hover,.input-field:focus,.pledge-field:focus{background:#002200;border-style:solid;outline:none;}
    .pledge-field{height:100px;resize:none;text-align:left;padding:20px;}
    .join-btn{margin-top:30px;padding:20px 80px;background:#00ff41;color:#000;border:none;border-radius:50px;font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 0 60px #00ff41;transition:0.4s;}
    .join-btn:hover{transform:scale(1.1);box-shadow:0 0 100px #00ff41;}

    .success{position:fixed;top:0;left:0;width:100%;height:100vh;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:300;color:#00ff41;text-align:center;opacity:0;transition:opacity 0.6s ease;}
    .success.active{ display:flex; opacity:1; }
    .success h1{font-family:'Orbitron',sans-serif;font-size:64px;text-shadow:0 0 60px #00ff41;animation:ritualPulse 2s ease-out;z-index:2;}
    .success p{margin-top:20px;font-size:20px;opacity:0;animation:fadeIn 1s ease 0.5s forwards;}
    .ritual-circle{position:absolute;width:300px;height:300px;border:3px solid #00ff41;border-radius:50%;box-shadow:0 0 80px #00ff41, inset 0 0 60px #00ff41;animation:expandGlow 2.5s ease-out forwards;opacity:0;z-index:1;}
    @keyframes expandGlow{0%{width:0;height:0;opacity:1;}70%{width:400px;height:400px;opacity:0.6;}100%{width:500px;height:500px;opacity:0;}}
    @keyframes fadeIn{to{opacity:0.8;}}

    /* PANEL */
    .panel{position:absolute;left:20px; bottom:20px;width:380px; max-width:calc(100vw - 40px);background:#000;border:3px solid #00ff41;border-radius:25px;padding:18px;box-shadow:0 0 80px rgba(0,255,65,0.6);z-index:10;display:flex; flex-direction:column;pointer-events:auto;}
    .panel h3{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:28px;text-shadow:0 0 25px #00ff41;margin-bottom:12px;text-align:center;background:#001100;padding:10px;border-radius:16px;box-shadow:0 0 40px #00ff41 inset;}

    /* RECENT: show exactly 3 visible items, allow scroll for more */
    #recent { max-height: calc(72px * 3 + 6px); overflow-y: auto; scroll-behavior: smooth; padding-right:6px; }

    .entry{display:flex;align-items:center;margin:8px 0;padding:12px;background:rgba(0,255,65,0.04);border:2px solid #00ff41;border-radius:16px;position:relative;height:72px;flex-shrink:0;}
    .entry img{width:48px;height:48px;border-radius:50%;border:3px solid #00ff41;margin-right:12px;box-shadow:0 0 30px #00ff4188;position:relative;z-index:2;}
    .entry .name{color:#00ff88;font-weight:bold;font-family:'Orbitron',sans-serif;font-size:16px;text-align:left;flex:1;}
    .entry .pledge{color:#00ff88;font-size:13px;margin-top:6px;text-align:left;flex:1;opacity:0.95;}

    .ritual-marker img{border-radius:50%;border:4px solid #00ff41;box-shadow:0 0 30px #00ff41;position:relative;z-index:2;}
    .leaflet-popup-content-wrapper { background: #000 !important; color: #0f0 !important; border: 3px solid #00ff41 !important; border-radius: 20px !important; padding: 0 !important; box-shadow: 0 0 40px rgba(0,255,65,0.6) !important; }
    .leaflet-popup-content { margin: 0 !important; padding: 16px !important; text-align: center !important; font-family: 'Orbitron', sans-serif !important; position: relative; }
    .leaflet-popup-content img { width: 80px !important; height: 80px !important; border-radius: 50% !important; border: 4px solid #00ff41 !important; margin-bottom: 12px !important; box-shadow: 0 0 20px #00ff41 !important; position: relative; z-index: 2; }

    .map-click-pulse { position: absolute; width: 60px; height: 60px; background: rgba(0,255,65,0.4); border-radius: 50%; pointer-events: none; z-index: 999; animation: clickPulse 0.8s ease-out forwards; }
    @keyframes clickPulse { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }

    /* toast */
    #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; background: rgba(0,0,0,0.85); color: #00ff41; border: 2px solid #00ff41; padding: 10px 16px; border-radius: 12px; box-shadow: 0 0 40px rgba(0,255,65,0.3); z-index: 9999; display: none; font-family: 'Orbitron', sans-serif; }

    @media (max-width:420px){ .title-text{ font-size:34px; letter-spacing:8px; } .title-bar{ height:92px; } .panel{ left:12px; bottom:14px; width:320px; padding:14px; } #recent{ max-height: calc(72px * 3 + 6px); } }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="title-bar">
    <div id="ritualLogo"><img src="ritualnet-logo.png" alt="logo"></div>
    <div class="title-text" id="titleLink">RITUALNET</div>
  </div>
  <div class="subtitle">Let’s Make The World Ritualize</div>

  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent" style="scroll-snap-type: y mandatory;"></div>
  </div>

  <div class="modal" id="ritualModal">
    <div class="card">
      <div class="close-btn" id="closeBtn">X</div>
      <h2>PERFORM THE RITUAL</h2>
      <div class="avatar-circle"><img src="ritualnet-logo.png" id="avatarPreview" alt="avatar"></div>
      <label class="upload-btn">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field input-field" id="pledge" placeholder="Speak your pledge..."></textarea>
      <button class="join-btn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <div class="success" id="success">
    <div class="ritual-circle"></div>
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <div id="resetConfirm" style="display:none;">
    <div style="color:#00ff41;font-family:'Orbitron',sans-serif;font-size:20px;margin-bottom:10px;">RESET THE CIRCLE?</div>
    <button id="confirmReset" style="margin-right:10px;background:#00ff41;color:#000;padding:12px 18px;border-radius:12px;border:none;font-weight:900;">BURN IT ALL</button>
    <button id="cancelReset" style="background:#333;color:#00ff41;padding:12px 18px;border-radius:12px;border:2px solid #00ff41;">CANCEL</button>
  </div>

  <div id="toast"></div>

  <script>
    // --- restore your original Supabase constants (full key) ---
    const SUPABASE_URL = 'https://xgttfiqewnwpqguhbpgv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndHRmaXFld253cHFndWhicGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxOTY1ODgsImV4cCI6MjA3ODc3MjU4OH0.zVK46pTGH0_Ruu20s35ep8NnsQd2ROenG_EuWezXiWg';
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.__supabase = supabase;

    // UI helpers
    function showToast(msg, ms = 3500) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      clearTimeout(t._hideTimer);
      t._hideTimer = setTimeout(() => { t.style.display = 'none'; }, ms);
    }

    // --- map setup ---
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      minZoom: 2,
      maxZoom: 19
    }).setView([10, 0], 2);

    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const markers = L.layerGroup().addTo(map);
    const recent = document.getElementById('recent');
    let clickedPos = null;
    let logoClicks = 0;
    let clickTimer = null;
    const addedIds = new Set();

    function getSize() {
      const z = map.getZoom();
      if (z <= 3) return 30;
      if (z <= 5) return 40;
      if (z <= 7) return 50;
      return 65;
    }
    function createIcon(src) {
      const s = getSize();
      return L.divIcon({
        className: 'ritual-marker',
        html: `<img src="${src}" style="width:${s}px;height:${s}px;">`,
        iconSize: [s, s],
        iconAnchor: [s/2, s/2]
      });
    }

    map.on('zoomend', () => {
      markers.eachLayer(m => {
        try {
          const data = m.options?.data || m.data;
          if (data?.avatar) m.setIcon(createIcon(data.avatar));
        } catch (err) { console.error('zoomend update error', err); }
      });
    });

    function addSummoningToUI(s) {
      if (!s) return;
      if (s.id && addedIds.has(s.id)) return;
      if (s.id) addedIds.add(s.id);

      const avatarUrl = s.avatar || 'ritualnet-logo.png';
      const icon = createIcon(avatarUrl);
      const m = L.marker([s.lat, s.lng], { icon, data: s }).addTo(markers);
      m.data = s;
      m.bindPopup(`
        <div style="position:relative;text-align:center;">
          <img src="${avatarUrl}">
          <b>@${s.name}</b>
          <i>"${s.pledge}"</i>
        </div>
      `);

      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `
        <img src="${avatarUrl}">
        <div style="flex:1;">
          <div class="name">@${s.name}</div>
          <div class="pledge">"${s.pledge}"</div>
        </div>
      `;
      recent.prepend(entry);
    }

    async function loadAll() {
      // Attempt DB load; if fail, fallback to localStorage minimal cache
      try {
        const { data, error } = await window.__supabase.from('summonings').select('*').order('timestamp', { ascending: false }).limit(200);
        if (error) {
          console.warn('Supabase load error:', error);
          showToast('Failed to load summonings from server — showing cached data if available.');
          // fallback
          const cached = localStorage.getItem('ritualnet_summonings');
          if (cached) {
            try {
              const parsed = JSON.parse(cached);
              markers.clearLayers(); recent.innerHTML = ''; addedIds.clear();
              // parsed only contains minimal items (id, created_at) — if you prefer full cached rows, change earlier caching
              // Attempt to rehydrate by IDs if stored rows exist in localStorage as 'ritualnet_summonings_full'
              const full = localStorage.getItem('ritualnet_summonings_full');
              if (full) {
                const rows = JSON.parse(full);
                rows.forEach(r => addSummoningToUI(r));
              }
            } catch (e) { console.error('failed reading cache', e); }
          }
          return;
        }

        // store minimal cache plus full rows so fallback works
        localStorage.setItem('ritualnet_summonings', JSON.stringify(data.map(d => ({ id:d.id, created_at: d.timestamp || d.created_at }))));
        try { localStorage.setItem('ritualnet_summonings_full', JSON.stringify(data)); } catch(e){ /* ignore if quota */ }

        markers.clearLayers(); recent.innerHTML = ''; addedIds.clear();
        data.forEach(s => addSummoningToUI(s));
      } catch (err) {
        console.error('Unexpected loadAll error', err);
        showToast('Unexpected error loading summonings — check console.');
      }
    }

    loadAll();

    // Realtime subscribe (safe)
    try {
      window.__supabase
        .channel('summonings-channel')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'summonings' }, payload => {
          addSummoningToUI(payload.new);
        })
        .subscribe();
    } catch (err) {
      console.warn('Realtime subscribe issue:', err);
    }

    // Map click opens modal
    map.on('click', function(e) {
      clickedPos = e.latlng;
      const pulse = document.createElement('div');
      pulse.className = 'map-click-pulse';
      pulse.style.left = (e.containerPoint.x - 30) + 'px';
      pulse.style.top = (e.containerPoint.y - 30) + 'px';
      document.body.appendChild(pulse);
      setTimeout(() => pulse.remove(), 800);

      const modal = document.getElementById('ritualModal');
      modal.style.display = 'flex';
      document.getElementById('avatarPreview').src = 'ritualnet-logo.png';
      document.getElementById('username').value = '';
      document.getElementById('pledge').value = '';
      setTimeout(() => document.getElementById('username').focus(), 120);
    });

    document.getElementById('titleLink').onclick = () => window.open('https://x.com/ritualnet', '_blank');

    const closeModal = () => {
      document.getElementById('ritualModal').style.display = 'none';
      clickedPos = null;
    };
    document.getElementById('closeBtn').onclick = closeModal;
    document.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) closeModal(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // avatar preview (dataURL)
    document.querySelector('.upload-btn').onclick = () => document.getElementById('avatarInput').click();
    document.getElementById('avatarInput').onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => document.getElementById('avatarPreview').src = ev.target.result;
        reader.readAsDataURL(file);
      }
    };

    // join button - insert
    document.querySelector('.join-btn').onclick = async () => {
      const avatar = document.getElementById('avatarPreview').src;
      const name = (document.getElementById('username').value || "ritualist").trim();
      const pledge = (document.getElementById('pledge').value || "I have joined.").trim();
      if (!clickedPos) { showToast('Click on the map to choose a location first.'); return; }

      const newSummon = { name, pledge, avatar, lat: clickedPos.lat, lng: clickedPos.lng, timestamp: Date.now() };
      try {
        const { data, error } = await window.__supabase.from('summonings').insert(newSummon).select();
        if (error) {
          console.error('Insert error', error);
          showToast('Failed to join — check console.');
          return;
        }
        if (!data || !data[0]) { showToast('Insert returned no data.'); return; }

        closeModal();
        const success = document.getElementById('success');
        success.classList.add('active');
        setTimeout(() => {
          success.classList.remove('active');
          map.flyTo(clickedPos, 10, { duration: 1.8 });
        }, 2800);

        addSummoningToUI(data[0]);
      } catch (err) {
        console.error('join unexpected', err);
        showToast('Unexpected error while joining — check console.');
      }
    };

    // logo reset clicks
    document.getElementById('ritualLogo').onclick = () => {
      logoClicks++;
      if (clickTimer) clearTimeout(clickTimer);
      if (logoClicks === 7) {
        document.getElementById('resetConfirm').style.display = 'flex';
        logoClicks = 0;
      } else {
        clickTimer = setTimeout(() => { logoClicks = 0; }, 3000);
      }
    };

    document.getElementById('confirmReset').onclick = async () => {
      // keep explicit; deletes where id != 0 (basically all)
      try {
        await window.__supabase.from('summonings').delete().neq('timestamp', 0);
        localStorage.removeItem('ritualnet_summonings');
        localStorage.removeItem('ritualnet_summonings_full');
        loadAll();
        document.getElementById('resetConfirm').style.display = 'none';
        showToast('Circle reset.');
      } catch (err) {
        console.error('reset failed', err);
        showToast('Failed to reset — check console.');
      }
    };
    document.getElementById('cancelReset').onclick = () => { document.getElementById('resetConfirm').style.display = 'none'; };

  </script>
</body>
</html>
