<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ritualnet Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    #map {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }

    /* Header */
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 70px;
      background: linear-gradient(to bottom, rgba(0,20,0,0.95), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 10;
      border-bottom: 1px solid #00ff4133;
    }
    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 900;
      color: #00ff41;
      text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff4188;
      letter-spacing: 4px;
    }

    /* Recent Summonings Panel */
    .summonings-panel {
      position: absolute;
      left: 20px;
      bottom: 100px;
      width: 380px;
      background: rgba(0,15,0,0.95);
      border: 1px solid #00ff41;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0,255,65,0.4);
      backdrop-filter: blur(10px);
      z-index: 10;
      animation: float 7s ease-in-out infinite;
    }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      color: #00ff41;
      text-shadow: 0 0 15px #00ff41;
      margin-bottom: 16px;
    }
    .summoning {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      padding: 10px;
      background: rgba(0,255,65,0.05);
      border-left: 4px solid #00ff41;
      border-radius: 0 10px 10px 0;
      opacity: 0;
      transform: translateX(-50px);
      animation: slideIn 0.8s ease-out forwards;
    }
    .summoning:nth-child(1) { animation-delay: 0.2s; }
    .summoning:nth-child(2) { animation-delay: 0.4s; }
    .summoning:nth-child(3) { animation-delay: 0.6s; }
    .summoning img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin-right: 14px;
      border: 3px solid #00ff41;
      box-shadow: 0 0 25px #00ff4188;
    }
    .text {
      font-size: 15px;
    }
    .username {
      color: #00ff88;
      font-weight: bold;
      font-family: 'Orbitron', sans-serif;
    }

    /* Summon Button */
    .summon-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #00ff41;
      border: 2px solid #00ff41;
      padding: 18px 60px;
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 40px #00ff4188;
      z-index: 10;
      animation: pulse 2.5s infinite;
      transition: all 0.3s;
    }
    .summon-btn:hover {
      transform: translateX(-50%) scale(1.1);
      box-shadow: 0 0 60px #00ff41;
    }

    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 40px #00ff4188; } 50% { box-shadow: 0 0 70px #00ff41; } }
    @keyframes slideIn { to { opacity:1; transform:translateX(0); } }

    /* Avatar Glow */
    .ritual-marker img {
      filter: drop-shadow(0 0 20px #00ff41) drop-shadow(0 0 40px #00ff4188);
      animation: glow 4s ease-in-out infinite alternate;
    }
    @keyframes glow { from { filter: drop-shadow(0 0 20px #00ff41); } to { filter: drop-shadow(0 0 40px #00ff41); } }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="header">
    <div class="logo">RITUALNET</div>
  </div>

  <div class="summonings-panel">
    <div class="title">Recent Summonings</div>
    <div id="summoningsList"></div>
  </div>

  <button class="summon-btn" id="summonBtn">SUMMON ON MAP</button>

  <script>
    // Dark black map (exactly like Succinct Map)
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
      attribution: '',
      maxZoom: 19
    }).addTo(map);

    const markers = L.layerGroup().addTo(map);
    const recentList = document.getElementById('summoningsList');
    let summonings = [];

    function updateRecent() {
      recentList.innerHTML = '';
      summonings.slice(-3).reverse().forEach(s => {
        const div = document.createElement('div');
        div.className = 'summoning';
        div.innerHTML = `
          <img src="${s.pfp}" alt="@${s.username}">
          <div class="text">
            <div class="username">@${s.username}</div>
            "${s.pledge}"
          </div>
        `;
        recentList.appendChild(div);
      });
    }

    document.getElementById('summonBtn').addEventListener('click', () => {
      alert("Click anywhere on the map to begin your summoning ritual...");
      
      const clickHandler = (e) => {
        map.off('click', clickHandler);

        const username = prompt("Enter your X / Twitter username (without @):", "")?.trim();
        if (!username) return alert("Username required to summon.");

        const pledge = prompt("Speak your pledge to the Ritualnet:", "I am here to build the future")?.trim();
        if (!pledge) return alert("A pledge is required to join the circle.");

        // Use Twitter PFP (via avatar API)
        const pfp = `https://unavatar.io/x/${username}`;

        const icon = L.divIcon({
          className: 'ritual-marker',
          html: `<img src="${pfp}" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${username}'" style="width:60px;height:60px;border-radius:50%;border:4px solid #00ff41;">`,
          iconSize: [60, 60],
          iconAnchor: [30, 60]
        });

        const marker = L.marker(e.latlng, { icon }).addTo(markers);
        marker.bindPopup(`
          <div style="background:#000;color:#0f0;padding:12px;border:2px solid #0f0;border-radius:12px;text-align:center;">
            <img src="${pfp}" width="60" height="60" style="border-radius:50%;border:3px solid #0f0;margin-bottom:8px;">
            <br><b style="color:#00ff41;">@${username}</b>
            <br><i>"${pledge}"</i>
          </div>
        `).openPopup();

        // Save & show in recent
        summonings.push({ username, pledge, pfp, lat: e.latlng.lat, lng: e.latlng.lng });
        updateRecent();

        map.setView(e.latlng, 8, { animate: true });
      };

      map.once('click', clickHandler);
    });

    // Optional: Welcome message
    setTimeout(() => {
      if (summonings.length === 0) {
        alert("Welcome to Ritualnet.\nClick 'SUMMON ON MAP' and place your mark on the world.");
      }
    }, 1500);
  </script>
</body>
</html>
