<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RITUALNET</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{margin:0;background:#000;overflow:hidden;height:100vh;font-family:'Rajdhani',sans-serif;color:#0f0;}
    #map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
    .leaflet-control-zoom,.leaflet-control-attribution{display:none!important;}
    .title-bar{position:absolute;top:0;left:0;right:0;height:110px;background:linear-gradient(to bottom,rgba(0,30,0,0.98),transparent);display:flex;align-items:center;justify-content:center;gap:25px;z-index:100;}
    #ritualLogo{width:82px;height:82px;cursor:pointer;filter:drop-shadow(0 0 40px #00ff41);animation:glow 5s infinite alternate;}
    #ritualLogo img{width:100%;height:100%;}
    #ritualLogo:hover{transform:scale(1.25);}
    .title-text{font-family:'Orbitron',sans-serif;font-size:56px;font-weight:900;background:linear-gradient(90deg,#00ff41,#00ff99);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px #00ff4188;letter-spacing:12px;cursor:pointer;}
    .subtitle{position:absolute;top:100px;left:50%;transform:translateX(-50%);font-size:16px;letter-spacing:2px;color:#00ff88;text-shadow:0 0 20px #00ff41;font-family:'Orbitron',sans-serif;z-index:100;}
    @keyframes glow{0%{filter:drop-shadow(0 0 30px #00ff41);}100%{filter:drop-shadow(0 0 70px #00ff41);}}

    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;z-index:200;}
    .card{width:430px;background:#000;padding:50px 40px;border:3px solid #00ff41;border-radius:30px;text-align:center;box-shadow:0 0 100px rgba(0,255,65,0.7);}
    .close-btn{position:absolute;top:20px;right:25px;width:40px;height:40px;background:transparent;border:2px solid #00ff41;border-radius:50%;color:#00ff41;font-size:28px;cursor:pointer;}
    .close-btn:hover{background:#00ff4111;transform:rotate(90deg);}
    .card h2{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:42px;text-shadow:0 0 30px #00ff41;margin-bottom:40px;letter-spacing:8px;}
    .avatar-circle{width:140px;height:140px;border-radius:50%;margin:30px auto;border:6px solid #00ff41;overflow:hidden;background:#000;box-shadow:0 0 60px #00ff4188;}
    .avatar-circle img{width:100%;height:100%;object-fit:cover;}
    .upload-btn,.input-field,.pledge-field{width:100%;padding:18px;margin:18px 0;background:#001100;border:2px dashed #00ff41;border-radius:20px;color:#00ff88;font-size:18px;text-align:center;cursor:pointer;}
    .upload-btn:hover,.input-field:focus,.pledge-field:focus{background:#002200;border-style:solid;outline:none;}
    .pledge-field{height:100px;resize:none;text-align:left;padding:20px;}
    .join-btn{margin-top:30px;padding:20px 80px;background:#00ff41;color:#000;border:none;border-radius:50px;font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 0 60px #00ff41;}
    .join-btn:hover{transform:scale(1.1);box-shadow:0 0 100px #00ff41;}

    .success{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:300;color:#00ff41;text-align:center;opacity:0;visibility:hidden;transition:opacity 0.6s;}
    .success.active{opacity:1;visibility:visible;}
    .success h1{font-family:'Orbitron',sans-serif;font-size:64px;text-shadow:0 0 60px #00ff41;}
    .ritual-circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0;border:4px solid #00ff41;border-radius:50%;box-shadow:0 0 80px #00ff41;animation:expand 2.5s ease-out forwards;opacity:0;}
    @keyframes expand{0%{width:0;height:0;opacity:1;}60%{width:380px;height:380px;opacity:0.8;}100%{width:500px;height:500px;opacity:0;}}

    .panel{position:absolute;left:20px;bottom:20px;width:380px;max-height:calc(100vh-180px);background:#000;border:3px solid #00ff41;border-radius:25px;padding:20px;box-shadow:0 0 80px rgba(0,255,65,0.6);z-index:10;overflow-y:auto;}
    .panel h3{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:28px;text-shadow:0 0 25px #00ff41;margin-bottom:15px;text-align:center;background:#001100;padding:12px;border-radius:20px;}
    .entry{display:flex;align-items:center;margin:12px 0;padding:14px;background:rgba(0,255,65,0.08);border:2px solid #00ff41;border-radius:20px;}
    .entry img{width:48px;height:48px;border-radius:50%;border:3px solid #00ff41;margin-right:15px;box-shadow:0 0 30px #00ff4188;}
    .entry .name{color:#00ff88;font-weight:bold;font-family:'Orbitron',sans-serif;font-size:17px;text-align:center;flex:1;}
    .entry .pledge{color:#00ff88;font-size:14px;margin-top:4px;text-align:center;flex:1;}
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="title-bar">
    <div id="ritualLogo"><img src="https://i.imgur.com/8Y7K8vP.png" alt="Logo"></div>
    <div class="title-text">RITUALNET</div>
  </div>
  <div class="subtitle">Let’s Make The World Ritualize</div>

  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent"></div>
  </div>

  <div class="modal" id="ritualModal">
    <div class="card">
      <div class="close-btn" id="closeBtn">X</div>
      <h2>PERFORM THE RITUAL</h2>
      <div class="avatar-circle"><img src="https://i.imgur.com/8Y7K8vP.png" id="avatarPreview"></div>
      <label class="upload-btn">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field input-field" id="pledge" placeholder="Speak your pledge..."></textarea>
      <button class="join-btn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <div class="success" id="success">
    <div class="ritual-circle"></div>
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <div id="resetConfirm" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;padding:40px;border:3px solid #00ff41;border-radius:30px;z-index:400;text-align:center;">
    <div style="font-size:32px;color:#00ff41;margin-bottom:20px;">RESET THE CIRCLE?</div>
    <button id="confirmReset" style="margin:10px;padding:15px 40px;background:#00ff41;color:#000;border:none;border-radius:50px;font-family:'Orbitron',sans-serif;font-size:24px;cursor:pointer;">BURN IT ALL</button>
    <button id="cancelReset" style="margin:10px;padding:15px 40px;background:#001100;color:#00ff41;border:2px solid #00ff41;border-radius:50px;font-family:'Orbitron',sans-serif;font-size:24px;cursor:pointer;">CANCEL</button>
  </div>

  <script>
    const API_BASE = '/api';
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([10, 0], 2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png').addTo(map);

    const markers = L.layerGroup().addTo(map);
    const recent = document.getElementById('recent');
    let clickedPos = null;
    let logoClicks = 0;
    let clickTimer = null;

    function createIcon(src) {
      return L.divIcon({
        className: 'ritual-marker',
        html: `<img src="${src}" style="width:50px;height:50px;border-radius:50%;border:3px solid #00ff41;">`,
        iconSize: [50, 50],
        iconAnchor: [25, 25]
      });
    }

    function loadAll() {
      const summonings = JSON.parse(localStorage.getItem('ritualnet_summonings') || '[]');
      const deduped = summonings.filter((s, i, a) => a.findIndex(t => t.id === s.id) === i).slice(-3).reverse();

      markers.clearLayers();
      recent.innerHTML = '';

      deduped.forEach(s => {
        const icon = createIcon(s.avatar || 'https://i.imgur.com/8Y7K8vP.png');
        const m = L.marker([s.lat, s.lng], { icon }).addTo(markers);
        m.bindPopup(`<div style="text-align:center;"><img src="${s.avatar || 'https://i.imgur.com/8Y7K8vP.png'}" style="width:70px;height:70px;border-radius:50%;border:3px solid #00ff41;"><br><b>@${s.name}</b><br><i>"${s.pledge}"</i></div>`);

        const entry = document.createElement('div');
        entry.className = 'entry';
        entry.innerHTML = `<img src="${s.avatar || 'https://i.imgur.com/8Y7K8vP.png'}"><div><div class="name">@${s.name}</div><div class="pledge">"${s.pledge}"</div></div>`;
        recent.appendChild(entry);
      });
    }

    // GLOBAL SYNC VIA POLLING
    async function syncWithServer() {
      try {
        const res = await fetch(`${API_BASE}/load`);
        if (res.ok) {
          const serverData = await res.json();
          localStorage.setItem('ritualnet_summonings', JSON.stringify(serverData));
          loadAll();
        }
      } catch (e) {}
    }

    syncWithServer();
    setInterval(syncWithServer, 3000);

    map.on('click', e => {
      clickedPos = e.latlng;
      document.getElementById('ritualModal').style.display = 'flex';
      document.getElementById('avatarPreview').src = 'https://i.imgur.com/8Y7K8vP.png';
      document.getElementById('username').value = '';
      document.getElementById('pledge').value = '';
    });

    const closeModal = () => {
      document.getElementById('ritualModal').style.display = 'none';
      clickedPos = null;
    };
    document.getElementById('closeBtn').onclick = closeModal;
    document.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) closeModal(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.querySelector('.upload-btn').onclick = () => document.getElementById('avatarInput').click();
    document.getElementById('avatarInput').onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => document.getElementById('avatarPreview').src = ev.target.result;
        reader.readAsDataURL(file);
      }
    };

    document.querySelector('.join-btn').onclick = async () => {
      const avatar = document.getElementById('avatarPreview').src;
      const name = document.getElementById('username').value.trim() || "ritualist";
      const pledge = document.getElementById('pledge').value.trim() || "I have joined.";
      if (!clickedPos) return;

      const payload = { 
        name, pledge, avatar, 
        lat: clickedPos.lat, lng: clickedPos.lng, 
        timestamp: Date.now() 
      };

      // SEND TO SERVER + LOCAL
      try {
        const res = await fetch(`${API_BASE}/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success && result.data) {
          const newSummon = result.data;
          const all = JSON.parse(localStorage.getItem('ritualnet_summonings') || '[]');
          all.push(newSummon);
          localStorage.setItem('ritualnet_summonings', JSON.stringify(all));
          loadAll();
        }
      } catch (e) {}

      closeModal();
      const success = document.getElementById('success');
      success.classList.add('active');
      setTimeout(() => {
        success.classList.remove('active');
        map.flyTo(clickedPos, 10, { duration: 1.8 });
      }, 3200);
    };

    document.getElementById('ritualLogo').onclick = () => {
      logoClicks++;
      if (clickTimer) clearTimeout(clickTimer);
      if (logoClicks === 7) {
        document.getElementById('resetConfirm').style.display = 'flex';
        logoClicks = 0;
      } else {
        clickTimer = setTimeout(() => { logoClicks = 0; }, 3000);
      }
    };

    document.getElementById('confirmReset').onclick = () => {
      localStorage.removeItem('ritualnet_summonings');
      loadAll();
      document.getElementById('resetConfirm').style.display = 'none';
    };

    document.getElementById('cancelReset').onclick = () => {
      document.getElementById('resetConfirm').style.display = 'none';
    };

    // INITIAL LOAD
    loadAll();
  </script>
</body>
</html>
