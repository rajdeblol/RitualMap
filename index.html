<html lang="en">
<head>

  <!-- Supabase Init -->
  <script>

    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndHRmaXFld253cHFndWhicGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxOTY1ODgsImV4cCI6MjA3ODc3MjU4OH0.zVK46pTGH0_Ruu20s35ep8NnsQd2ROenG_EuWezXiWg';

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
    *, *::before, *::after {margin:0;padding:0;box-sizing:border-box;}
    
    html, body {
      margin: 0; padding: 0; background: #000; overflow: hidden;
      height: 100dvh; width: 100vw; font-family: 'Rajdhani', sans-serif;
      color: #0f0; touch-action: manipulation; position: fixed;
    }

    #map {
      position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; z-index: 1;
    }
    .leaflet-control-zoom, .leaflet-control-attribution {display: none !important;}

    /* TITLE BAR */
    .title-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 110px;
      background: linear-gradient(to bottom, rgba(0,30,0,0.98), transparent);
      display: flex; align-items: center; justify-content: center; gap: 15px;
      z-index: 100; user-select: none; padding-top: env(safe-area-inset-top);
      flex-wrap: wrap; padding: 10px;
    }
    #ritualLogo {
      width: 70px; height: 70px; cursor: pointer;
      filter: drop-shadow(0 0 40px #00ff41); animation: glow 5s infinite alternate;
      transition: 0.3s; position: relative; flex-shrink: 0;
    }
    #ritualLogo img {width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 2;}
    #ritualLogo::before {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 68%; height: 68%; background: url('ritualnet-logo.png') center/contain no-repeat;
      opacity: 0.18; z-index: -1; pointer-events: none; animation: ritualPulse 6s infinite ease-in-out;
    }
    #ritualLogo:hover {transform: scale(1.25);}

    .title-text {
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      background: linear-gradient(90deg, #00ff41, #00ff99);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 60px #00ff4188; letter-spacing: 8px; cursor: pointer;
      font-size: clamp(36px, 8vw, 56px); white-space: nowrap; text-align: center;
    }
    .title-text::before {
      content: 'RITUALNET'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: inherit; letter-spacing: 8px; opacity: 0.18;
      background: linear-gradient(90deg, #00ff41, #00ff99);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: ritualPulse 6s infinite ease-in-out; z-index: -1;
    }

    .subtitle {
      position: fixed; top: calc(110px + env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      font-size: 14px; letter-spacing: 2px; color: #00ff88;
      text-shadow: 0 0 20px #00ff41; font-family: 'Orbitron', sans-serif;
      white-space: nowrap; z-index: 100;
    }

    @keyframes glow {0%{filter: drop-shadow(0 0 30px #00ff41);}100%{filter: drop-shadow(0 0 70px #00ff41);}}
    @keyframes ritualPulse {
      0%,100%{opacity:0.15;transform:translate(-50%,-50%) scale(1);}
      50%{opacity:0.25;transform:translate(-50%,-50%) scale(1.08);}
    }

    /* PANEL — SCROLL TOP → BOTTOM */
    .panel {
      position: fixed;
      left: 15px; bottom: 15px;
      width: 300px; max-width: calc(100vw - 30px);
      max-height: 240px;
      background: #000;
      border: 3px solid #00ff41;
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 0 60px rgba(0,255,65,0.6);
      z-index: 10;
      overflow-y: auto;
      display: flex; flex-direction: column; /* Normal: top → bottom */
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .panel h3 {
      font-family: 'Orbitron', sans-serif; color: #00ff41; font-size: 18px;
      text-shadow: 0 0 20px #00ff41; margin-bottom: 8px; text-align: center;
      background: #001100; padding: 8px; border-radius: 15px;
      box-shadow: 0 0 30px #00ff41 inset; font-weight: 900;
    }
    .entry {
      display: flex; align-items: center; margin: 8px 0; padding: 10px;
      background: rgba(0,255,65,0.08); border: 2px solid #00ff41;
      border-radius: 15px; position: relative; flex-shrink: 0;
      scroll-snap-align: start;
      cursor: pointer;
      transition: 0.2s;
    }
    .entry:active {background: rgba(255,0,0,0.2); transform: scale(0.98);}
    .entry img {
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid #00ff41;
      margin-right: 10px; box-shadow: 0 0 20px #00ff4188; z-index: 2;
    }
    .entry::before {
      content: ''; position: absolute; top: 50%; left: 18px; transform: translate(-50%,-50%);
      width: 28px; height: 28px; background: url('ritualnet-logo.png') center/contain no-repeat;
      opacity: 0.18; z-index: 1; pointer-events: none; animation: ritualPulse 5s infinite ease-in-out;
    }
    .entry .name {color: #00ff88; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 14px; flex: 1;}
    .entry .pledge {color: #00ff88; font-size: 12px; margin-top: 2px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

    /* ADMIN DELETE CONFIRM */
    #deleteConfirm {
      position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: rgba(0,0,0,0.98);
      backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center;
      flex-direction: column; z-index: 500; color: #ff0044; text-align: center; font-family: 'Orbitron', sans-serif;
    }
    #deleteConfirm button {
      margin: 15px; font-size: 22px; padding: 14px 50px; border-radius: 40px;
      font-family: 'Orbitron', sans-serif; font-weight: 900; cursor: pointer;
    }
    #confirmDelete {background: #ff0044; color: #fff; box-shadow: 0 0 60px #ff0044;}
    #cancelDelete {background: #333; color: #00ff41; border: 2px solid #00ff41;}

    /* MODAL & SUCCESS */
    .modal { /* same as before */ }
    .success { /* same as before */ }

    /* OTHER STYLES (popup, markers, etc.) — unchanged */
    .leaflet-popup-content-wrapper {background: #000 !important; color: #0f0 !important; border: 3px solid #00ff41 !important; border-radius: 20px !important; padding: 0 !important; box-shadow: 0 0 40px rgba(0,255,65,0.6) !important;}
    .leaflet-popup-content {margin: 0 !important; padding: 12px !important; text-align: center !important; font-family: 'Orbitron', sans-serif !important; position: relative;}
    .leaflet-popup-content img {width: 70px !important; height: 70px !important; border-radius: 50% !important; border: 3px solid #00ff41 !important; margin-bottom: 10px !important; box-shadow: 0 0 20px #00ff41 !important; z-index: 2;}
    .leaflet-popup-content::before {content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: url('ritualnet-logo.png') center/contain no-repeat; opacity: 0.18; z-index: 1; animation: ritualPulse 6s infinite ease-in-out;}
    .leaflet-popup-content b {color: #00ff41 !important; font-size: 16px !important; display: block; margin: 6px 0;}
    .leaflet-popup-content i {font-size: 13px !important; opacity: 0.9; display: block;}
    .leaflet-popup-tip {background: #00ff41 !important; box-shadow: 0 0 20px #00ff41 !important;}
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="title-bar">
    <div id="ritualLogo"><img src="ritualnet-logo.png"></div>
    <div class="title-text" id="titleLink">RITUALNET</div>
  </div>

  <div class="subtitle">Let’s Make The World Ritualize</div>

  <!-- PANEL: TOP → BOTTOM SCROLL -->
  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent"></div>
  </div>

  <!-- MODAL & SUCCESS (unchanged) -->
  <div class="modal" id="ritualModal">...</div>
  <div class="success" id="success">...</div>

  <!-- RESET ALL -->
  <div id="resetConfirm">...</div>

  <!-- DELETE SINGLE -->
  <div id="deleteConfirm">
    <div>BURN THIS RITUAL?</div>
    <div id="deleteTarget"></div>
    <button id="confirmDelete">BURN</button>
    <button id="cancelDelete">CANCEL</button>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 2, maxZoom: 19 }).setView([10, 0], 2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const markers = L.layerGroup().addTo(map);
    const recent = document.getElementById('recent');
    let clickedPos = null;
    let logoClicks = 0;
    let clickTimer = null;
    let deleteTarget = null;

    function getSize() { /* same */ }
    function createIcon(src) { /* same */ }

    map.on('zoomend', () => { /* same */ });

    function addSummoningToUI(s) {
      const icon = createIcon(s.avatar || 'ritualnet-logo.png');
      const m = L.marker([s.lat, s.lng], { icon, data: s }).addTo(markers);
      m.bindPopup(`<div style="position:relative;text-align:center;"><img src="${s.avatar || 'ritualnet-logo.png'}"><b>@${s.name}</b><i>"${s.pledge}"</i></div>`);

      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.dataset.id = s.id;
      entry.innerHTML = `<img src="${s.avatar || 'ritualnet-logo.png'}"><div><div class="name">@${s.name}</div><div class="pledge">"${s.pledge}"</div></div>`;

      // LONG PRESS TO DELETE
      let pressTimer;
      entry.addEventListener('mousedown', () => pressTimer = setTimeout(() => showDeleteConfirm(s, entry), 800));
      entry.addEventListener('mouseup', () => clearTimeout(pressTimer));
      entry.addEventListener('mouseleave', () => clearTimeout(pressTimer));
      entry.addEventListener('touchstart', (e) => { e.preventDefault(); pressTimer = setTimeout(() => showDeleteConfirm(s, entry), 800); });
      entry.addEventListener('touchend', () => clearTimeout(pressTimer));

      recent.prepend(entry); // Newest at top
    }

    function showDeleteConfirm(s, entry) {
      deleteTarget = { id: s.id, entry, marker: null };
      markers.eachLayer(m => { if (m.options.data?.id === s.id) deleteTarget.marker = m; });
      document.getElementById('deleteTarget').textContent = `@${s.name}`;
      document.getElementById('deleteConfirm').style.display = 'flex';
    }

    async function loadAll() {
      const { data, error } = await window.__supabase.from('summonings').select('*').order('timestamp', { ascending: false }).limit(100);
      if (error) return;
      localStorage.setItem('ritualnet_summonings', JSON.stringify(data));
      markers.clearLayers(); recent.innerHTML = '';
      data.forEach(addSummoningToUI);
    }

    loadAll();

    // REAL-TIME
    window.__supabase.channel('summonings-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'summonings' }, payload => addSummoningToUI(payload.new))
      .subscribe();

    // MODAL LOGIC (unchanged)
    map.on('click', /* ... same ... */);

    // 7-CLICK RESET — SERVER DELETE
    document.getElementById('ritualLogo').onclick = () => {
      logoClicks++;
      if (clickTimer) clearTimeout(clickTimer);
      if (logoClicks === 7) {
        document.getElementById('resetConfirm').style.display = 'flex';
        logoClicks = 0;
      } else {
        clickTimer = setTimeout(() => { logoClicks = 0; }, 3000);
      }
    };

    document.getElementById('confirmReset').onclick = async () => {
      await window.__supabase.from('summonings').delete().gt('id', 0);
      localStorage.removeItem('ritualnet_summonings');
      markers.clearLayers(); recent.innerHTML = '';
      document.getElementById('resetConfirm').style.display = 'none';
    };

    // SINGLE DELETE
    document.getElementById('confirmDelete').onclick = async () => {
      if (!deleteTarget) return;
      await window.__supabase.from('summonings').delete().eq('id', deleteTarget.id);
      deleteTarget.entry.remove();
      if (deleteTarget.marker) deleteTarget.marker.remove();
      document.getElementById('deleteConfirm').style.display = 'none';
      deleteTarget = null;
    };

    document.getElementById('cancelDelete').onclick = () => {
      document.getElementById('deleteConfirm').style.display = 'none';
      deleteTarget = null;
    };
  </script>
</body>
</html>
