<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RITUALNET</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsSQ-i34f0BErk3qwNMK4QET07FbCvjWk",
      authDomain: "ritual-65fc5.firebaseapp.com",
      databaseURL: "https://ritual-65fc5-default-rtdb.firebaseio.com",
      projectId: "ritual-65fc5",
      storageBucket: "ritual-65fc5.firebasestorage.app",
      messagingSenderId: "249645412824",
      appId: "1:249645412824:web:159f0919dd0c4c18fc02ad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const summoningsRef = ref(db, 'ritualnet/summonings');
    window.__firebase = { onValue, push, remove, summoningsRef };
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{margin:0;background:#000;overflow:hidden;height:100vh;font-family:'Rajdhani',sans-serif;color:#0f0;}
    #map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
    .leaflet-control-zoom, .leaflet-control-attribution{display:none!important;}

    /* TITLE BAR */
    .title-bar{
      position:absolute;top:0;left:0;right:0;height:110px;
      background:linear-gradient(to bottom,rgba(0,30,0,0.98),transparent);
      display:flex;align-items:center;justify-content:center;gap:25px;z-index:100;user-select:none;
    }
    #ritualLogo{
      width:82px;height:82px;cursor:pointer;
      filter:drop-shadow(0 0 40px #00ff41);
      animation:glow 5s infinite alternate;
      transition:0.3s;
      position:relative;
    }
    #ritualLogo img{width:100%;height:100%;position:absolute;top:0;left:0;z-index:2;}
    #ritualLogo::before{
      content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:68%;height:68%;background:url('ritualnet-logo.png') center/contain no-repeat;
      opacity:0.18;z-index:-1;pointer-events:none;animation:ritualPulse 6s infinite ease-in-out;
    }
    #ritualLogo:hover{transform:scale(1.25);}

    .title-text{
      font-family:'Orbitron',sans-serif;font-size:56px;font-weight:900;
      background:linear-gradient(90deg,#00ff41,#00ff99);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      text-shadow:0 0 60px #00ff4188;letter-spacing:12px;cursor:pointer;
      position:relative;
    }
    .title-text::before{
      content:'RITUALNET';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      font-size:56px;letter-spacing:12px;opacity:0.18;
      background:linear-gradient(90deg,#00ff41,#00ff99);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      animation:ritualPulse 6s infinite ease-in-out;z-index:-1;
    }

    .subtitle{
      position:absolute;top:100px;left:50%;transform:translateX(-50%);
      font-size:16px;letter-spacing:2px;color:#00ff88;
      text-shadow:0 0 20px #00ff41;font-family:'Orbitron',sans-serif;
      white-space:nowrap;z-index:100;
    }

    @keyframes glow{0%{filter:drop-shadow(0 0 30px #00ff41);}100%{filter:drop-shadow(0 0 70px #00ff41);}}
    @keyframes ritualPulse{
      0%,100%{opacity:0.15;transform:translate(-50%,-50%) scale(1);}
      50%{opacity:0.25;transform:translate(-50%,-50%) scale(1.08);}
    }

    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);backdrop-filter:blur(20px);
      display:none;align-items:center;justify-content:center;z-index:200;}
    .card{width:430px;background:#000;padding:50px 40px;border:3px solid #00ff41;border-radius:30px;
      text-align:center;position:relative;box-shadow:0 0 100px rgba(0,255,65,0.7);}
    .close-btn{position:absolute;top:20px;right:25px;width:40px;height:40px;background:transparent;
      border:2px solid #00ff41;border-radius:50%;color:#00ff41;font-size:28px;cursor:pointer;}
    .close-btn:hover{background:#00ff4111;transform:rotate(90deg);}
    .card h2{font-family:'Orbitron',sans-serif;color:#00ff41;font-size:42px;text-shadow:0 0 30px #00ff41;margin-bottom:40px;letter-spacing:8px;}
    
    .avatar-circle{
      width:140px;height:140px;border-radius:50%;margin:30px auto;
      border:6px solid #00ff41;overflow:hidden;background:#000;
      box-shadow:0 0 60px #00ff4188;position:relative;
    }
    .avatar-circle img{width:100%;height:100%;object-fit:cover;position:relative;z-index:2;}
    .avatar-circle::before{
      content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:68%;height:68%;background:url('ritualnet-logo.png') center/contain no-repeat;
      opacity:0.18;z-index:1;pointer-events:none;animation:ritualPulse 6s infinite ease-in-out;
    }

    .upload-btn,.input-field,.pledge-field{width:100%;padding:18px;margin:18px 0;background:#001100;
      border:2px dashed #00ff41;border-radius:20px;color:#00ff88;font-size:18px;text-align:center;cursor:pointer;transition:0.3s;}
    .upload-btn:hover,.input-field:focus,.pledge-field:focus{background:#002200;border-style:solid;outline:none;}
    .pledge-field{height:100px;resize:none;text-align:left;padding:20px;}
    .join-btn{margin-top:30px;padding:20px 80px;background:#00ff41;color:#000;border:none;border-radius:50px;
      font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 0 60px #00ff41;transition:0.4s;}
    .join-btn:hover{transform:scale(1.1);box-shadow:0 0 100px #00ff41;}

    /* SUCCESS — NOW WITH FULL GLOWING CIRCLE + CENTERED */
    .success{
      position:fixed;top:0;left:0;width:100%;height:100%;background:#000;
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      z-index:300;color:#00ff41;text-align:center;
      opacity:0;visibility:hidden;transition:opacity 0.6s ease;pointer-events:none;
    }
    .success.active{ 
      opacity:1; visibility:visible; pointer-events:all; 
    }

    .success h1{
      font-family:'Orbitron',sans-serif;font-size:64px;text-shadow:0 0 60px #00ff41;
      animation:ritualPulse 2s ease-out;z-index:2;position:relative;
    }
    .success p{
      margin-top:20px;font-size:20px;opacity:0;
      animation:fadeIn 1s ease 0.5s forwards;
    }

    /* EXPANDING GREEN CIRCLE ANIMATION */
    .ritual-circle{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:0;height:0;
      border:4px solid #00ff41;
      border-radius:50%;
      box-shadow:0 0 80px #00ff41, 0 0 120px #00ff41, inset 0 0 60px #00ff41;
      animation:expandGlow 2.5s ease-out forwards;
      opacity:0;z-index:1;
    }
    @keyframes expandGlow{
      0%  {width:0;height:0;opacity:1;transform:translate(-50%,-50%) scale(0);}
      60% {width:380px;height:380px;opacity:0.8;transform:translate(-50%,-50%) scale(1);}
      100%{width:500px;height:500px;opacity:0;transform:translate(-50%,-50%) scale(1.2);}
    }
    @keyframes fadeIn{to{opacity:0.8;}}

    /* PANEL — SHOW ONLY LAST 3 SUMMONINGS */
    .panel{
      position:absolute;left:20px;bottom:20px;width:380px;max-height:calc(100vh - 180px);
      background:#000;border:3px solid #00ff41;border-radius:25px;
      padding:20px;box-shadow:0 0 80px rgba(0,255,65,0.6);z-index:10;
      overflow-y:auto;display:flex;flex-direction:column;
    }
    .panel h3{
      font-family:'Orbitron',sans-serif;color:#00ff41;font-size:28px;
      text-shadow:0 0 25px #00ff41;margin-bottom:15px;text-align:center;
      background:#001100;padding:12px;border-radius:20px;
      box-shadow:0 0 40px #00ff41 inset;
    }
    .entry{
      display:flex;align-items:center;margin:12px 0;padding:14px;
      background:rgba(0,255,65,0.08);border:2px solid #00ff41;
      border-radius:20px;position:relative;flex-shrink:0;
    }
    .entry img{
      width:48px;height:48px;border-radius:50%;border:3px solid #00ff41;
      margin-right:15px;box-shadow:0 0 30px #00ff4188;position:relative;z-index:2;
    }
    .entry::before{
      content:'';position:absolute;top:50%;left:24px;transform:translate(-50%,-50%);
      width:36px;height:36px;background:url('ritualnet-logo.png') center/contain no-repeat;
      opacity:0.18;z-index:1;pointer-events:none;animation:ritualPulse 5s infinite ease-in-out;
    }
    .entry .name{color:#00ff88;font-weight:bold;font-family:'Orbitron',sans-serif;font-size:17px;text-align:center;flex:1;}
    .entry .pledge{color:#00ff88;font-size:14px;margin-top:4px;text-align:center;flex:1;}

    .ritual-marker img{
      border-radius:50%;border:4px solid #00ff41;box-shadow:0 0 30px #00ff41;position:relative;z-index:2;
    }
    .ritual-marker::after{
      content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:60%;height:60%;background:url('ritualnet-logo.png') center/contain no-repeat;
      opacity:0.18;z-index:1;pointer-events:none;animation:ritualPulse 7s infinite ease-in-out;
    }

    #resetConfirm{
      position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);
      backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;
      flex-direction:column;z-index:400;color:#00ff41;text-align:center;font-family:'Orbitron',sans-serif;
    }
    #resetConfirm button{
      margin:20px;font-size:28px;padding:18px 60px;border-radius:50px;
      font-family:'Orbitron',sans-serif;font-weight:900;cursor:pointer;
    }
    #confirmReset{background:#00ff41;color:#000;box-shadow:0 0 60px #00ff41;}
    #cancelReset{background:#333;color:#00ff41;border:2px solid #00ff41;}

    /* POPUP */
    .leaflet-popup-content-wrapper {
      background: #000 !important; color: #0f0 !important;
      border: 3px solid #00ff41 !important; border-radius: 20px !important;
      padding: 0 !important; box-shadow: 0 0 40px rgba(0,255,65,0.6) !important;
    }
    .leaflet-popup-content {
      margin: 0 !important; padding: 16px !important; text-align: center !important;
      font-family: 'Orbitron', sans-serif !important; position: relative;
    }
    .leaflet-popup-content img {
      width: 80px !important; height: 80px !important; border-radius: 50% !important;
      border: 4px solid #00ff41 !important; margin-bottom: 12px !important;
      box-shadow: 0 0 20px #00ff41 !important; position: relative; z-index: 2;
    }
    .leaflet-popup-content::before {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 48px; height: 48px; background: url('ritualnet-logo.png') center/contain no-repeat;
      opacity: 0.18; z-index: 1; pointer-events: none; animation: ritualPulse 6s infinite ease-in-out;
    }
    .leaflet-popup-content b { color: #00ff41 !important; font-size: 18px !important; display: block; margin: 8px 0; }
    .leaflet-popup-content i { font-size: 14px !important; opacity: 0.9; display: block; }
    .leaflet-popup-tip { background: #00ff41 !important; box-shadow: 0 0 20px #00ff41 !important; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- TITLE BAR -->
  <div class="title-bar">
    <div id="ritualLogo"><img src="ritualnet-logo.png"></div>
    <div class="title-text" id="titleLink">RITUALNET</div>
  </div>

  <!-- SUBTITLE -->
  <div class="subtitle">Let’s Make The World Ritualize</div>

  <!-- PANEL — LAST 3 ONLY -->
  <div class="panel">
    <h3>Recent Summonings</h3>
    <div id="recent"></div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="ritualModal">
    <div class="card">
      <div class="close-btn" id="closeBtn">X</div>
      <h2>PERFORM THE RITUAL</h2>
      <div class="avatar-circle"><img src="ritualnet-logo.png" id="avatarPreview"></div>
      <label class="upload-btn">UPLOAD AVATAR</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      <input type="text" class="input-field" id="username" placeholder="X / Twitter username">
      <textarea class="pledge-field input-field" id="pledge" placeholder="Speak your pledge..."></textarea>
      <button class="join-btn">JOIN THE CIRCLE</button>
    </div>
  </div>

  <!-- SUCCESS — WITH EXPANDING CIRCLE -->
  <div class="success" id="success">
    <div class="ritual-circle"></div>
    <h1>YOU ARE RITUALIZED</h1>
    <p>The circle grows stronger.</p>
  </div>

  <!-- RESET CONFIRM -->
  <div id="resetConfirm">
    <div>RESET THE CIRCLE?</div>
    <button id="confirmReset">BURN IT ALL</button>
    <button id="cancelReset">CANCEL</button>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([10, 0], 2);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const markers = L.layerGroup().addTo(map);
    const recent = document.getElementById('recent');
    let clickedPos = null;
    let logoClicks = 0;
    let clickTimer = null;

    function getSize() {
      const z = map.getZoom();
      if (z <= 3) return 30;
      if (z <= 5) return 40;
      if (z <= 7) return 50;
      return 65;
    }

    function createIcon(src) {
      const s = getSize();
      return L.divIcon({
        className: 'ritual-marker',
        html: `<img src="${src}" style="width:${s}px;height:${s}px;">`,
        iconSize: [s, s],
        iconAnchor: [s/2, s/2]
      });
    }

    map.on('zoomend', () => {
      markers.eachLayer(m => {
        const data = m.options.data;
        if (data?.avatar) m.setIcon(createIcon(data.avatar));
      });
    });

    function loadAll() {
      let summonings = JSON.parse(localStorage.getItem('ritualnet_summonings') || '[]');

      // Deduplicate by ID
      const seen = new Set();
      summonings = summonings.filter(s => s.id && !seen.has(s.id) && seen.add(s.id));

      markers.clearLayers(); 
      recent.innerHTML = '';

      // SHOW ONLY LAST 3 (MOST RECENT)
      const latestThree = summonings.slice(-3).reverse();

      latestThree.forEach(s => {
        const icon = createIcon(s.avatar || 'ritualnet-logo.png');
        const m = L.marker([s.lat, s.lng], { icon, data: s }).addTo(markers);

        m.bindPopup(`
          <div style="position:relative;text-align:center;">
            <img src="${s.avatar || 'ritualnet-logo.png'}">
            <b>@${s.name}</b>
            <i>"${s.pledge}"</i>
          </div>
        `);

        const entry = document.createElement('div');
        entry.className = 'entry';
        entry.innerHTML = `
          <img src="${s.avatar || 'ritualnet-logo.png'}">
          <div><div class="name">@${s.name}</div><div class="pledge">"${s.pledge}"</div></div>
        `;
        recent.appendChild(entry);
      });
    }

    loadAll();

    document.getElementById('titleLink').onclick = () => window.open('https://x.com/ritualnet', '_blank');

    map.on('click', e => {
      clickedPos = e.latlng;
      document.getElementById('ritualModal').style.display = 'flex';
      document.getElementById('avatarPreview').src = 'ritualnet-logo.png';
      document.getElementById('username').value = '';
      document.getElementById('pledge').value = '';
    });

    const closeModal = () => {
      document.getElementById('ritualModal').style.display = 'none';
      clickedPos = null;
    };
    document.getElementById('closeBtn').onclick = closeModal;
    document.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal')) closeModal(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.querySelector('.upload-btn').onclick = () => document.getElementById('avatarInput').click();
    document.getElementById('avatarInput').onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => document.getElementById('avatarPreview').src = ev.target.result;
        reader.readAsDataURL(file);
      }
    };

    document.querySelector('.join-btn').onclick = () => {
      const avatar = document.getElementById('avatarPreview').src;
      const name = document.getElementById('username').value.trim() || "ritualist";
      const pledge = document.getElementById('pledge').value.trim() || "I have joined.";
      if (!clickedPos) return;

      const newSummon = { 
        id: Date.now(),
        name, pledge, avatar, 
        lat: clickedPos.lat, lng: clickedPos.lng, 
        timestamp: Date.now() 
      };

      const all = JSON.parse(localStorage.getItem('ritualnet_summonings') || '[]');
      all.push(newSummon);
      localStorage.setItem('ritualnet_summonings', JSON.stringify(all));
      loadAll();

      if (window.__firebase) {
        window.__firebase.push(window.__firebase.summoningsRef, newSummon);
      }

      closeModal();
      const success = document.getElementById('success');
      success.classList.add('active');
      setTimeout(() => {
        success.classList.remove('active');
        map.flyTo(clickedPos, 10, { duration: 1.8 });
      }, 3200);
    };

    document.getElementById('ritualLogo').onclick = () => {
      logoClicks++;
      if (clickTimer) clearTimeout(clickTimer);
      if (logoClicks === 7) {
        document.getElementById('resetConfirm').style.display = 'flex';
        logoClicks = 0;
      } else {
        clickTimer = setTimeout(() => { logoClicks = 0; }, 3000);
      }
    };

    document.getElementById('confirmReset').onclick = () => {
      localStorage.removeItem('ritualnet_summonings');
      loadAll();
      if (window.__firebase) {
        window.__firebase.remove(window.__firebase.summoningsRef);
      }
      document.getElementById('resetConfirm').style.display = 'none';
    };

    document.getElementById('cancelReset').onclick = () => {
      document.getElementById('resetConfirm').style.display = 'none';
    };

    // Firebase Real-Time Sync
    if (window.__firebase) {
      const { onValue, summoningsRef } = window.__firebase;
      onValue(summoningsRef, (snap) => {
        const data = snap.val();
        const arr = data ? Object.values(data) : [];
        localStorage.setItem('ritualnet_summonings', JSON.stringify(arr));
        loadAll();
      });
    }
  </script>
</body>
</html>
